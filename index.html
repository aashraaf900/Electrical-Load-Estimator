<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electrical Load Estimator</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for compiling JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Custom Print Controls -->
    <style>
        @media print {
            body {
                background: white;
                color: black;
                font-size: 12px;
            }
            .no-print {
                display: none !important;
            }
            .print-area {
                width: 100%;
                max-width: 100%;
                box-shadow: none !important;
                border: none !important;
                margin: 0 !important;
                padding: 0 !important;
            }
            @page {
                size: A4 portrait;
                margin: 15mm;
            }
            table {
                page-break-inside: auto;
            }
            tr {
                page-break-inside: avoid;
                page-break-after: auto;
            }
            .print-editable {
                border: none !important;
                background: transparent !important;
                padding: 0 !important;
                resize: none !important;
                outline: none !important;
                box-shadow: none !important;
                overflow: hidden;
            }
            input::placeholder, textarea::placeholder {
                color: transparent !important;
            }
        }
        
        .print-editable {
            border: 1px dashed transparent;
            transition: all 0.2s;
            width: 100%;
        }
        .print-editable:hover, .print-editable:focus {
            border-color: #cbd5e1;
            background-color: #f8fafc;
            outline: none;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useRef } = React;

        // --- UI Icons ---
        const Plus = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>;
        const Trash2 = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>;
        const Zap = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>;
        const Activity = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>;
        const TableIcon = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3v18"></path><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M3 9h18"></path><path d="M3 15h18"></path></svg>;
        const Edit3 = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>;
        const Folder = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"></path></svg>;
        const ShieldAlert = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg>;
        const PrinterIcon = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>;
        const LinkIcon = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>;
        const HomeIcon = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>;
        const SettingsIcon = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>;
        const UploadIcon = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>;

        function App() {
          const [activeTab, setActiveTab] = useState('WORKSPACE');
          const [settings, setSettings] = useState({ voltage: 230, powerFactor: 0.85 });
          
          const [lightingGroups, setLightingGroups] = useState([]);
          const [powerLoads, setPowerLoads] = useState([]);

          const [companyInfo, setCompanyInfo] = useState({
            name: "",
            address: "",
            logoUrl: "" 
          });
          
          const [clientInfo, setClientInfo] = useState({
            projectName: "",
            name: "",
            address: ""
          });

          const [printHeaders, setPrintHeaders] = useState({
            reportTitle: "Electrical Load Estimation Report",
            reportSubtitle: "Sub-Distribution Board (SDB) Load Distribution",
            sysVoltageLabel: "System Voltage",
            pfLabel: "Power Factor",
            preparedBy: "Electrical Design Engineer",
            approvedBy: "Lead Engineering Consultant",
            section1Title: "1. Group Details (Connected Loads before Diversity)",
            section2Title: "2. SDB Design Load (Linked Groups & Custom Loads)"
          });

          const fileInputRef = useRef(null);

          const lightingDefaults = [
            { label: 'CF', full: 'CF', w: 80 },
            { label: 'TL', full: 'TL', w: 40 },
            { label: 'CL', full: 'CL', w: 20 },
            { label: 'WL', full: 'WL', w: 20 },
            { label: 'ExF', full: 'ExF', w: 40 },
            { label: 'ChL', full: 'ChL', w: 40 },
            { label: 'ML', full: 'ML', w: 10 },
            { label: '2-Pin', full: '2-Pin Socket', w: 200 }
          ];

          const powerDefaults = [
            { label: '3-Pin', full: '3-Pin Socket', w: 1000 },
            { label: 'AC', full: 'Air Conditioner', w: 1200 },
            { label: 'Geyser', full: 'Water Geyser', w: 1200 },
            { label: 'Motor', full: 'Water Pump', w: 1000 }
          ];

          const calculateCurrent = (wattage) => {
            if (!settings.voltage || !settings.powerFactor || wattage === 0) return 0;
            return (wattage / (settings.voltage * settings.powerFactor)).toFixed(2);
          };

          const updateSetting = (field, value) => setSettings({ ...settings, [field]: parseFloat(value) || 0 });
          const updatePrintHeader = (field, value) => setPrintHeaders({ ...printHeaders, [field]: value });
          const updateCompanyInfo = (field, value) => setCompanyInfo({ ...companyInfo, [field]: value });
          const updateClientInfo = (field, value) => setClientInfo({ ...clientInfo, [field]: value });

          const handleTextareaResize = (e) => {
              e.target.style.height = 'auto';
              e.target.style.height = (e.target.scrollHeight) + 'px';
          };

          const handleLogoUpload = (e) => {
              const file = e.target.files[0];
              if (file) {
                  const reader = new FileReader();
                  reader.onloadend = () => {
                      setCompanyInfo({...companyInfo, logoUrl: reader.result});
                  };
                  reader.readAsDataURL(file);
              }
          };

          const removeLogo = () => {
              setCompanyInfo({...companyInfo, logoUrl: ""});
              if(fileInputRef.current) fileInputRef.current.value = "";
          };

          const addGroup = () => {
            setLightingGroups([...lightingGroups, { id: `g-${Date.now()}`, name: `Group-${lightingGroups.length + 1}`, boards: [] }]);
          };

          const updateGroupName = (groupId, name) => {
            setLightingGroups(lightingGroups.map(g => g.id === groupId ? { ...g, name } : g));
          };

          const deleteGroup = (groupId) => {
            setLightingGroups(lightingGroups.filter(g => g.id !== groupId));
            setPowerLoads(powerLoads.filter(pl => !(pl.type === 'GROUP' && pl.refId === groupId)));
          };

          const addBoard = (groupId) => {
            setLightingGroups(lightingGroups.map(g => {
              if (g.id === groupId) {
                return { ...g, boards: [...g.boards, { id: `sb-${Date.now()}`, name: `SB-${g.boards.length + 1}`, points: [] }] };
              }
              return g;
            }));
          };

          const updateBoardName = (groupId, boardId, name) => {
            setLightingGroups(lightingGroups.map(g => {
              if (g.id === groupId) {
                return { ...g, boards: g.boards.map(b => b.id === boardId ? { ...b, name } : b) };
              }
              return g;
            }));
          };

          const deleteBoard = (groupId, boardId) => {
            setLightingGroups(lightingGroups.map(g => g.id === groupId ? { ...g, boards: g.boards.filter(b => b.id !== boardId) } : g));
          };

          const addLightingPoint = (groupId, boardId, defaultName = '', defaultWatt = 0) => {
            setLightingGroups(lightingGroups.map(g => g.id === groupId ? {
              ...g, boards: g.boards.map(b => b.id === boardId ? {
                ...b, points: [...b.points, { id: `p-${Date.now()}`, name: defaultName, qty: 1, watt: defaultWatt }]
              } : b)
            } : g));
          };

          const updateLightingPoint = (groupId, boardId, pointId, field, value) => {
            setLightingGroups(lightingGroups.map(g => g.id === groupId ? {
              ...g, boards: g.boards.map(b => b.id === boardId ? {
                ...b, points: b.points.map(p => p.id === pointId ? { ...p, [field]: field === 'name' ? value : (parseFloat(value) || 0) } : p)
              } : b)
            } : g));
          };

          const deleteLightingPoint = (groupId, boardId, pointId) => {
            setLightingGroups(lightingGroups.map(g => g.id === groupId ? {
              ...g, boards: g.boards.map(b => b.id === boardId ? { ...b, points: b.points.filter(p => p.id !== pointId) } : b)
            } : g));
          };

          const addPowerLoad = (defaultName = '', defaultWatt = 0) => {
            setPowerLoads([...powerLoads, { id: `pl-${Date.now()}`, type: 'CUSTOM', name: defaultName, qty: 1, watt: defaultWatt, diversity: 1.0 }]);
          };

          const addGroupToPowerLoads = (groupId) => {
            if(powerLoads.some(pl => pl.type === 'GROUP' && pl.refId === groupId)) return;
            setPowerLoads([...powerLoads, { 
                id: `pl-${Date.now()}`, 
                type: 'GROUP', 
                refId: groupId, 
                name: '', 
                qty: 1, 
                watt: 0, 
                diversity: 0.8 
            }]);
          };

          const updatePowerLoad = (plId, field, value) => {
            setPowerLoads(powerLoads.map(pl => pl.id === plId ? { ...pl, [field]: field === 'name' ? value : (parseFloat(value) || 0) } : pl));
          };

          const deletePowerLoad = (plId) => setPowerLoads(powerLoads.filter(pl => pl.id !== plId));
          const handlePrint = () => window.print();

          const { lightingGroupsList, lightingGroupsMap, totalConnectedLighting } = useMemo(() => {
            let total = 0;
            const map = {};
            
            lightingGroups.forEach(g => {
              let gTotal = 0;
              const boardsWithTotals = g.boards.map(b => {
                const bTotal = b.points.reduce((sum, p) => sum + (p.qty * p.watt), 0);
                gTotal += bTotal;
                return { ...b, totalWatt: bTotal, current: calculateCurrent(bTotal) };
              });
              
              total += gTotal;
              map[g.id] = { id: g.id, name: g.name, boards: boardsWithTotals, totalWatt: gTotal, current: calculateCurrent(gTotal) };
            });

            return {
              lightingGroupsList: lightingGroups.map(g => map[g.id]),
              lightingGroupsMap: map,
              totalConnectedLighting: total
            };
          }, [lightingGroups, settings]);

          const { processedPowerLoads, totalDesignPower, finalTotalCurrent } = useMemo(() => {
            let totalW = 0;
            const processed = powerLoads.map(pl => {
                let currentWatt = pl.watt;
                let displayName = pl.name;
                
                if (pl.type === 'GROUP') {
                    const groupData = lightingGroupsMap[pl.refId];
                    currentWatt = groupData ? groupData.totalWatt : 0;
                    displayName = groupData ? groupData.name : 'Unknown Group';
                }
                
                const finalW = pl.qty * currentWatt * pl.diversity;
                totalW += finalW;
                return { ...pl, displayWatt: currentWatt, displayName, finalWatt: finalW };
            });

            return {
                processedPowerLoads: processed,
                totalDesignPower: totalW,
                finalTotalCurrent: calculateCurrent(totalW)
            };
          }, [powerLoads, lightingGroupsMap, settings]);

          return (
            <div className="min-h-screen pb-24">
              {/* Header Menu */}
              <header className="bg-slate-900 text-white shadow-md sticky top-0 z-20 no-print">
                <div className="max-w-6xl mx-auto px-4 py-3 sm:px-6 lg:px-8">
                  <div className="flex flex-col md:flex-row justify-between items-center gap-4">
                    <div className="flex items-center gap-3">
                      <Zap className="w-6 h-6 text-amber-400" />
                      <h1 className="text-lg font-bold tracking-wide">Load Estimator</h1>
                    </div>

                    <div className="flex bg-slate-800 rounded-lg p-1 overflow-x-auto w-full md:w-auto text-sm border border-slate-700">
                      <button onClick={() => setActiveTab('WORKSPACE')} className={`flex items-center whitespace-nowrap gap-2 px-4 py-2 rounded-md font-medium transition-colors ${activeTab === 'WORKSPACE' ? 'bg-slate-700 text-white shadow' : 'text-slate-400 hover:text-white'}`}><HomeIcon className="w-4 h-4" /> Workspace</button>
                      <button onClick={() => setActiveTab('LIGHTING')} className={`flex items-center whitespace-nowrap gap-2 px-4 py-2 rounded-md font-medium transition-colors ${activeTab === 'LIGHTING' ? 'bg-slate-700 text-white shadow' : 'text-slate-400 hover:text-white'}`}><Edit3 className="w-4 h-4" /> Lighting (SB)</button>
                      <button onClick={() => setActiveTab('POWER')} className={`flex items-center whitespace-nowrap gap-2 px-4 py-2 rounded-md font-medium transition-colors ${activeTab === 'POWER' ? 'bg-slate-700 text-white shadow' : 'text-slate-400 hover:text-white'}`}><ShieldAlert className="w-4 h-4" /> Power (SDB)</button>
                      <button onClick={() => setActiveTab('SUMMARY')} className={`flex items-center whitespace-nowrap gap-2 px-4 py-2 rounded-md font-medium transition-colors ${activeTab === 'SUMMARY' ? 'bg-slate-700 text-white shadow' : 'text-slate-400 hover:text-white'}`}><TableIcon className="w-4 h-4" /> Report</button>
                      <button onClick={() => setActiveTab('SETTINGS')} className={`flex items-center whitespace-nowrap gap-2 px-4 py-2 rounded-md font-medium transition-colors ${activeTab === 'SETTINGS' ? 'bg-slate-700 text-white shadow' : 'text-slate-400 hover:text-white'}`}><SettingsIcon className="w-4 h-4" /> Settings</button>
                    </div>
                  </div>
                </div>
              </header>

              <main className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                
                {/* --- TAB: WORKSPACE --- */}
                {activeTab === 'WORKSPACE' && (
                  <div className="space-y-6 max-w-2xl mx-auto no-print">
                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                      <h2 className="text-xl font-bold text-slate-800 border-b pb-3 mb-5">Project Details</h2>
                      <div className="space-y-4">
                        <div>
                          <label className="block text-sm font-medium text-slate-700 mb-1">Project Name</label>
                          <input type="text" value={clientInfo.projectName} onChange={(e) => updateClientInfo('projectName', e.target.value)} className="w-full border border-slate-300 rounded-lg px-4 py-2 focus:outline-none focus:border-blue-500" placeholder="e.g., Residential Complex Design" />
                        </div>
                        <div>
                          <label className="block text-sm font-medium text-slate-700 mb-1">Client Name</label>
                          <input type="text" value={clientInfo.name} onChange={(e) => updateClientInfo('name', e.target.value)} className="w-full border border-slate-300 rounded-lg px-4 py-2 focus:outline-none focus:border-blue-500" placeholder="Client or Organization Name" />
                        </div>
                        <div>
                          <label className="block text-sm font-medium text-slate-700 mb-1">Project Address</label>
                          <textarea value={clientInfo.address} onChange={(e) => updateClientInfo('address', e.target.value)} className="w-full border border-slate-300 rounded-lg px-4 py-2 focus:outline-none focus:border-blue-500 min-h-[100px]" placeholder="Full location address..."></textarea>
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {/* --- TAB: SETTINGS --- */}
                {activeTab === 'SETTINGS' && (
                  <div className="space-y-6 max-w-2xl mx-auto no-print">
                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                      <h2 className="text-xl font-bold text-slate-800 border-b pb-3 mb-5">Company Profile</h2>
                      <div className="space-y-4">
                        <div className="flex items-center gap-6 mb-6">
                          <div className="relative group shrink-0">
                            {companyInfo.logoUrl ? (
                                <div>
                                    <img src={companyInfo.logoUrl} alt="Company Logo" className="h-24 w-24 object-contain border border-slate-200 rounded-lg bg-slate-50" />
                                    <button onClick={removeLogo} className="absolute -top-2 -right-2 bg-red-500 text-white rounded-full p-1 opacity-0 group-hover:opacity-100 transition shadow"><Trash2 className="w-3 h-3"/></button>
                                </div>
                            ) : (
                                <div className="h-24 w-24 bg-slate-50 border-2 border-dashed border-slate-300 rounded-lg flex flex-col items-center justify-center text-slate-500 hover:bg-slate-100 cursor-pointer transition" onClick={() => fileInputRef.current.click()}>
                                    <UploadIcon className="w-6 h-6 mb-1" />
                                    <span className="text-xs font-medium">Logo</span>
                                </div>
                            )}
                            <input type="file" accept="image/*" ref={fileInputRef} onChange={handleLogoUpload} className="hidden" />
                          </div>
                          <div className="flex-1 space-y-3">
                            <div>
                                <label className="block text-sm font-medium text-slate-700 mb-1">Consultancy Name</label>
                                <input type="text" value={companyInfo.name} onChange={(e) => updateCompanyInfo('name', e.target.value)} className="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:border-blue-500" placeholder="Your Engineering Firm Name" />
                            </div>
                          </div>
                        </div>
                        <div>
                          <label className="block text-sm font-medium text-slate-700 mb-1">Address / Contact</label>
                          <textarea value={companyInfo.address} onChange={(e) => updateCompanyInfo('address', e.target.value)} className="w-full border border-slate-300 rounded-lg px-4 py-2 focus:outline-none focus:border-blue-500" placeholder="Company address, email, phone..."></textarea>
                        </div>
                      </div>
                    </div>

                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                      <h2 className="text-xl font-bold text-slate-800 border-b pb-3 mb-5">System Parameters</h2>
                      <div className="grid grid-cols-2 gap-6">
                        <div>
                          <label className="block text-sm font-medium text-slate-700 mb-1">System Voltage (V)</label>
                          <input type="number" value={settings.voltage} onChange={(e) => updateSetting('voltage', e.target.value)} className="w-full border border-slate-300 rounded-lg px-4 py-2 focus:outline-none focus:border-blue-500 bg-slate-50 font-semibold" />
                        </div>
                        <div>
                          <label className="block text-sm font-medium text-slate-700 mb-1">Power Factor (cos φ)</label>
                          <input type="number" step="0.01" value={settings.powerFactor} onChange={(e) => updateSetting('powerFactor', e.target.value)} className="w-full border border-slate-300 rounded-lg px-4 py-2 focus:outline-none focus:border-blue-500 bg-slate-50 font-semibold" />
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {/* --- TAB: LIGHTING --- */}
                {activeTab === 'LIGHTING' && (
                  <div className="space-y-6 no-print">
                    <div className="flex justify-between items-center bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                      <h2 className="text-lg font-bold text-slate-800">Connected Loads Configuration</h2>
                      <button onClick={addGroup} className="bg-blue-600 text-white px-4 py-2 rounded-lg font-medium shadow-sm hover:bg-blue-700 flex items-center gap-2">
                        <Plus className="w-4 h-4" /> New Group
                      </button>
                    </div>

                    {lightingGroupsList.length === 0 && (
                      <div className="text-center py-20 bg-white border border-slate-200 rounded-xl">
                        <p className="text-slate-500 font-medium">No records found.</p>
                      </div>
                    )}

                    {lightingGroupsList.map(group => (
                      <div key={group.id} className="bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm">
                        <div className="bg-slate-50 p-4 border-b border-slate-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                           <div className="flex items-center gap-3 w-full md:w-auto">
                              <Folder className="w-5 h-5 text-slate-400" />
                              <input type="text" value={group.name} onChange={(e) => updateGroupName(group.id, e.target.value)} className="bg-white border border-slate-300 px-3 py-1.5 rounded-lg font-bold text-slate-800 focus:outline-none focus:border-blue-500 w-full sm:w-64" placeholder="Group Name" />
                           </div>
                           <div className="flex items-center gap-6">
                              <div className="text-right">
                                <span className="text-[10px] text-slate-500 uppercase font-bold tracking-wider block">Connected Load</span>
                                <span className="text-lg font-bold text-slate-800">{group.totalWatt} W</span>
                              </div>
                              <button onClick={() => deleteGroup(group.id)} className="text-red-500 hover:bg-red-50 p-2 rounded-lg transition shrink-0">
                                <Trash2 className="w-4 h-4" />
                              </button>
                           </div>
                        </div>

                        <div className="p-4 sm:p-6 space-y-6">
                          {group.boards.length === 0 ? (
                            <div className="text-center py-4 text-slate-400 text-sm">0 Items</div>
                          ) : (
                            group.boards.map((board, bIndex) => (
                              <div key={board.id} className="border border-slate-200 rounded-lg overflow-hidden">
                                <div className="bg-slate-50 px-4 py-2 border-b border-slate-200 flex justify-between items-center">
                                  <div className="flex items-center gap-3">
                                    <div className="bg-slate-200 text-slate-600 w-6 h-6 rounded flex items-center justify-center text-xs font-bold shrink-0">{bIndex + 1}</div>
                                    <input type="text" value={board.name} onChange={(e) => updateBoardName(group.id, board.id, e.target.value)} className="bg-white border border-slate-300 px-2 py-1 rounded text-sm font-semibold text-slate-700 focus:outline-none focus:border-blue-500 w-48" placeholder="Board Name" />
                                  </div>
                                  <button onClick={() => deleteBoard(group.id, board.id)} className="text-slate-400 hover:text-red-500 p-1"><Trash2 className="w-4 h-4" /></button>
                                </div>

                                <div className="p-3">
                                  <div className="space-y-2 mb-3">
                                    {board.points.map(point => (
                                      <div key={point.id} className="flex flex-col sm:flex-row gap-2 sm:gap-4 items-center">
                                        <input type="text" value={point.name} onChange={(e) => updateLightingPoint(group.id, board.id, point.id, 'name', e.target.value)} className="w-full sm:flex-1 border border-slate-300 rounded px-2 py-1 text-sm focus:outline-none focus:border-blue-500" placeholder="Point Name" />
                                        <input type="number" min="1" value={point.qty || ''} onChange={(e) => updateLightingPoint(group.id, board.id, point.id, 'qty', e.target.value)} className="w-full sm:w-20 border border-slate-300 rounded px-2 py-1 text-sm text-center focus:outline-none focus:border-blue-500" placeholder="Qty" />
                                        <input type="number" min="0" value={point.watt === 0 && point.watt !== '0' ? '' : point.watt} onChange={(e) => updateLightingPoint(group.id, board.id, point.id, 'watt', e.target.value)} className="w-full sm:w-24 border border-slate-300 rounded px-2 py-1 text-sm text-center focus:outline-none focus:border-blue-500" placeholder="Watt" />
                                        <div className="w-full sm:w-24 text-right font-bold text-slate-700 text-sm">{(point.qty * point.watt) || 0} W</div>
                                        <button onClick={() => deleteLightingPoint(group.id, board.id, point.id)} className="p-1 text-slate-300 hover:text-red-500"><Trash2 className="w-4 h-4" /></button>
                                      </div>
                                    ))}
                                  </div>
                                  <div className="flex flex-wrap items-center gap-2 pt-2 border-t border-slate-100">
                                    {lightingDefaults.map(item => (
                                      <button key={item.label} onClick={() => addLightingPoint(group.id, board.id, item.full, item.w)} className="px-2 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded text-xs font-medium transition border border-slate-200">{item.label}</button>
                                    ))}
                                    <button onClick={() => addLightingPoint(group.id, board.id, '', 0)} className="px-2 py-1 bg-blue-50 text-blue-700 border border-blue-200 rounded text-xs font-bold hover:bg-blue-100 transition">+ Custom</button>
                                  </div>
                                </div>
                              </div>
                            ))
                          )}
                          <button onClick={() => addBoard(group.id)} className="w-full py-2 border border-dashed border-slate-300 text-slate-500 font-medium rounded hover:bg-slate-50 transition flex items-center justify-center gap-2 text-sm">
                            <Plus className="w-4 h-4" /> Switchboard
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}

                {/* --- TAB: POWER --- */}
                {activeTab === 'POWER' && (
                  <div className="space-y-6 no-print">
                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                      <div className="bg-slate-50 border-b border-slate-200 p-4 flex flex-wrap items-center gap-3">
                        <span className="text-sm font-bold text-slate-700">Link Connected Groups:</span>
                        {lightingGroupsList.length === 0 && <span className="text-sm text-slate-400">Data unavailable.</span>}
                        {lightingGroupsList.map(g => {
                          const isAdded = powerLoads.some(pl => pl.type === 'GROUP' && pl.refId === g.id);
                          return (
                            <button key={g.id} onClick={() => !isAdded && addGroupToPowerLoads(g.id)} disabled={isAdded} className={`px-3 py-1.5 rounded text-xs font-bold transition border ${isAdded ? 'bg-slate-100 text-slate-400 border-slate-200 cursor-not-allowed' : 'bg-white hover:bg-blue-50 hover:text-blue-700 text-slate-600 border-slate-300 shadow-sm'}`}>
                              {isAdded ? `✓ ${g.name}` : `+ ${g.name} (${g.totalWatt}W)`}
                            </button>
                          );
                        })}
                      </div>

                      <div className="p-6">
                        <div className="space-y-3 mb-6">
                          <div className="hidden sm:flex gap-4 text-xs font-semibold text-slate-500 uppercase tracking-wider px-2">
                            <div className="flex-1">Load Definition</div>
                            <div className="w-20 text-center">Qty</div>
                            <div className="w-24 text-center">Base W</div>
                            <div className="w-24 text-center">DF</div>
                            <div className="w-24 text-right">Final W</div>
                            <div className="w-8"></div>
                          </div>

                          {processedPowerLoads.length === 0 && (
                            <div className="text-center py-8 text-slate-400 border border-dashed rounded-lg">0 Items</div>
                          )}

                          {processedPowerLoads.map(pl => {
                            const isGroup = pl.type === 'GROUP';
                            return (
                              <div key={pl.id} className={`flex flex-col sm:flex-row gap-2 sm:gap-4 items-center p-3 sm:p-2 rounded border ${isGroup ? 'bg-slate-50 border-slate-200' : 'border-slate-200'}`}>
                                <input type="text" value={pl.displayName} onChange={(e) => !isGroup && updatePowerLoad(pl.id, 'name', e.target.value)} disabled={isGroup} className={`w-full sm:flex-1 border rounded px-3 py-1.5 text-sm focus:outline-none ${isGroup ? 'bg-transparent border-transparent font-semibold text-slate-700' : 'border-slate-300 focus:border-blue-500'}`} placeholder="Load Name" />
                                <input type="number" min="1" value={pl.qty || ''} onChange={(e) => !isGroup && updatePowerLoad(pl.id, 'qty', e.target.value)} disabled={isGroup} className={`w-full sm:w-20 border rounded px-2 py-1.5 text-sm text-center ${isGroup ? 'bg-transparent border-transparent font-semibold text-slate-700' : 'border-slate-300 focus:border-blue-500'}`} placeholder="Qty" />
                                <input type="number" min="0" value={pl.displayWatt === 0 && pl.displayWatt !== '0' ? '' : pl.displayWatt} onChange={(e) => !isGroup && updatePowerLoad(pl.id, 'watt', e.target.value)} disabled={isGroup} className={`w-full sm:w-24 border rounded px-2 py-1.5 text-sm text-center ${isGroup ? 'bg-transparent border-transparent font-semibold text-slate-700' : 'border-slate-300 focus:border-blue-500'}`} placeholder="Watt" />
                                <input type="number" step="0.05" min="0" max="1" value={pl.diversity} onChange={(e) => updatePowerLoad(pl.id, 'diversity', e.target.value)} className="w-full sm:w-24 border border-slate-300 bg-white font-semibold rounded px-2 py-1.5 text-sm text-center focus:outline-none focus:border-blue-500" title="Diversity Factor" />
                                <div className="w-full sm:w-24 text-right font-bold text-slate-800">{pl.finalWatt.toFixed(1)} W</div>
                                <button onClick={() => deletePowerLoad(pl.id)} className="w-full sm:w-8 p-1.5 text-slate-400 hover:text-red-500 flex justify-center"><Trash2 className="w-4 h-4" /></button>
                              </div>
                            );
                          })}
                        </div>
                        <div className="flex flex-wrap items-center gap-2 border-t border-slate-100 pt-4">
                          {powerDefaults.map(item => (
                            <button key={item.label} onClick={() => addPowerLoad(item.full, item.w)} className="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 rounded text-xs font-medium text-slate-700 transition border border-slate-200">{item.label}</button>
                          ))}
                          <button onClick={() => addPowerLoad('', 0)} className="px-3 py-1.5 bg-blue-50 text-blue-700 border border-blue-200 rounded text-xs font-bold hover:bg-blue-100 transition">+ Custom Load</button>
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {/* --- TAB: REPORT (Print Area) --- */}
                {activeTab === 'SUMMARY' && (
                  <div className="space-y-6">
                    <div className="flex justify-end no-print">
                      <button onClick={handlePrint} className="flex items-center gap-2 px-6 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-lg font-bold shadow transition">
                        <PrinterIcon className="w-4 h-4" /> Print Report
                      </button>
                    </div>

                    <div className="bg-white shadow border border-slate-200 p-8 print-area">
                      
                      {/* Company Header */}
                      <div className="flex justify-between items-start mb-6">
                        <div className="flex items-center gap-4">
                          {companyInfo.logoUrl && <img src={companyInfo.logoUrl} alt="Logo" className="h-16 w-16 object-contain" />}
                          <div>
                            <h2 className="text-xl font-bold text-slate-900">{companyInfo.name || "Company Name"}</h2>
                            <p className="text-xs text-slate-500 whitespace-pre-line">{companyInfo.address || "Company Address"}</p>
                          </div>
                        </div>
                        <div className="text-right text-sm">
                          <div className="bg-slate-50 border p-2">
                             <div><strong>System Voltage:</strong> {settings.voltage}V</div>
                             <div><strong>Power Factor:</strong> {settings.powerFactor}</div>
                          </div>
                        </div>
                      </div>

                      {/* Document Titles */}
                      <div className="border-b-2 border-slate-800 pb-4 mb-6 flex justify-between items-end">
                        <div className="w-2/3">
                          <input type="text" value={printHeaders.reportTitle} onChange={(e) => updatePrintHeader('reportTitle', e.target.value)} className="print-editable text-2xl font-bold tracking-tight text-slate-900 uppercase w-full block" />
                          <input type="text" value={printHeaders.reportSubtitle} onChange={(e) => updatePrintHeader('reportSubtitle', e.target.value)} className="print-editable text-sm text-slate-500 w-full block" />
                        </div>
                        <div className="text-right text-xs text-slate-600">
                           <p><strong>Project:</strong> {clientInfo.projectName || "N/A"}</p>
                           <p><strong>Client:</strong> {clientInfo.name || "N/A"}</p>
                           <p className="whitespace-pre-line">{clientInfo.address}</p>
                        </div>
                      </div>

                      {/* Main Table */}
                      <table className="w-full text-left border-collapse border border-slate-300 text-sm mb-12">
                        <thead>
                          <tr className="bg-slate-100 text-slate-800 uppercase text-xs tracking-wider border border-slate-300">
                            <th className="p-2 border border-slate-300">Distribution / Item</th>
                            <th className="p-2 border border-slate-300">Specification</th>
                            <th className="p-2 text-center border border-slate-300 w-16">Qty</th>
                            <th className="p-2 text-right border border-slate-300 w-24">Load (W)</th>
                            <th className="p-2 text-right border border-slate-300 w-24">Current (A)</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-300">
                          
                          {/* Section 1 Header */}
                          <tr className="bg-slate-50 font-bold text-slate-800 border-t-2 border-slate-400">
                            <td colSpan="5" className="p-2 border border-slate-300">
                               <input type="text" value={printHeaders.section1Title} onChange={(e) => updatePrintHeader('section1Title', e.target.value)} className="print-editable font-bold uppercase w-full bg-transparent" />
                            </td>
                          </tr>

                          {lightingGroupsList.length === 0 ? (
                            <tr><td colSpan="5" className="p-3 text-center text-slate-400 text-xs">No records.</td></tr>
                          ) : (
                            lightingGroupsList.map((group, gIndex) => (
                              <React.Fragment key={`P-L-${gIndex}`}>
                                <tr className="bg-slate-50/50 font-semibold text-slate-700">
                                  <td className="p-2 border border-slate-300" colSpan="5">{group.name}</td>
                                </tr>
                                {group.boards.map((b, bIndex) => (
                                  <React.Fragment key={`B-${bIndex}`}>
                                    <tr className="text-slate-700 font-medium">
                                      <td className="p-1 pl-4 border border-slate-300 text-xs">- {b.name}</td>
                                      <td className="p-1 border border-slate-300 text-xs text-slate-400">Switchboard Subtotal</td>
                                      <td className="p-1 text-center border border-slate-300 text-xs">{b.points.length}</td>
                                      <td className="p-1 text-right border border-slate-300 text-xs">{b.totalWatt} W</td>
                                      <td className="p-1 text-right border border-slate-300 text-xs">{b.current} A</td>
                                    </tr>
                                    {b.points.map((p, pIndex) => (
                                      <tr key={`pt-${pIndex}`} className="text-slate-500 text-[10px]">
                                        <td className="p-1 pl-8 border border-slate-200 border-r-0"></td>
                                        <td className="p-1 border border-slate-200">{p.name} ({p.watt}W)</td>
                                        <td className="p-1 text-center border border-slate-200">{p.qty}</td>
                                        <td className="p-1 text-right border border-slate-200">{p.qty * p.watt}</td>
                                        <td className="p-1 text-right border border-slate-200">{calculateCurrent(p.qty * p.watt)}</td>
                                      </tr>
                                    ))}
                                  </React.Fragment>
                                ))}
                              </React.Fragment>
                            ))
                          )}

                          {/* Section 2 Header */}
                          <tr className="bg-slate-50 font-bold text-slate-800 border-t-2 border-slate-400">
                            <td colSpan="5" className="p-2 border border-slate-300">
                               <input type="text" value={printHeaders.section2Title} onChange={(e) => updatePrintHeader('section2Title', e.target.value)} className="print-editable font-bold uppercase w-full bg-transparent" />
                            </td>
                          </tr>

                          {processedPowerLoads.length === 0 ? (
                            <tr><td colSpan="5" className="p-3 text-center text-slate-400 text-xs">No records.</td></tr>
                          ) : (
                            processedPowerLoads.map((pl, pIndex) => (
                              <tr key={`P-summary-${pIndex}`} className="text-xs text-slate-700">
                                <td className="p-2 border border-slate-300">{pl.type === 'GROUP' ? 'Linked Circuit' : 'Direct Circuit'}</td>
                                <td className="p-2 border border-slate-300 font-medium">{pl.displayName} (DF: {pl.diversity})</td>
                                <td className="p-2 text-center border border-slate-300">{pl.qty}</td>
                                <td className="p-2 text-right border border-slate-300">{pl.finalWatt.toFixed(1)} W</td>
                                <td className="p-2 text-right border border-slate-300">{calculateCurrent(pl.finalWatt)} A</td>
                              </tr>
                            ))
                          )}

                          {/* Final Row */}
                          <tr className="bg-slate-100 font-extrabold text-sm border-t-4 border-slate-800">
                            <td colSpan="3" className="p-3 text-right uppercase text-slate-800">Total Calculated Load:</td>
                            <td className="p-3 text-right border border-slate-300 text-slate-900">{totalDesignPower.toFixed(1)} W</td>
                            <td className="p-3 text-right border border-slate-300 text-slate-900">{finalTotalCurrent} A</td>
                          </tr>

                        </tbody>
                      </table>

                      {/* Sign-off Box */}
                      <div className="mt-8 grid grid-cols-2 gap-16 text-center text-xs text-slate-700">
                        <div className="border-t border-slate-400 pt-2">
                          <input type="text" value={printHeaders.preparedBy} onChange={(e) => updatePrintHeader('preparedBy', e.target.value)} className="print-editable font-bold uppercase text-slate-800 w-full text-center" />
                        </div>
                        <div className="border-t border-slate-400 pt-2">
                          <input type="text" value={printHeaders.approvedBy} onChange={(e) => updatePrintHeader('approvedBy', e.target.value)} className="print-editable font-bold uppercase text-slate-800 w-full text-center" />
                        </div>
                      </div>
                    </div>
                  </div>
                )}
              </main>

              {/* Status Bar */}
              <div className="fixed bottom-0 left-0 w-full bg-slate-100 text-slate-600 border-t border-slate-200 z-30 no-print text-xs">
                <div className="max-w-6xl mx-auto px-4 py-2 flex justify-between items-center">
                  <span className="font-semibold tracking-wider uppercase text-[10px]">System Status: Online</span>
                  <div className="flex gap-4">
                    <span>Power: <strong className="text-slate-800">{totalDesignPower.toFixed(1)} W</strong></span>
                    <span>Current: <strong className="text-slate-800">{finalTotalCurrent} A</strong></span>
                  </div>
                </div>
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
