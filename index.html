<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Load Estimator & Printer</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for compiling JSX in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Custom CSS for A4 Print Control -->
    <style>
        @media print {
            body {
                background: white;
                color: black;
                font-size: 12px;
            }
            .no-print {
                display: none !important;
            }
            .print-area {
                width: 100%;
                max-width: 100%;
                box-shadow: none !important;
                border: none !important;
                margin: 0 !important;
                padding: 0 !important;
            }
            /* A4 Specific settings */
            @page {
                size: A4 portrait;
                margin: 15mm;
            }
            table {
                page-break-inside: auto;
            }
            tr {
                page-break-inside: avoid;
                page-break-after: auto;
            }
            /* Ensure inputs look like normal text when printing */
            .print-editable {
                border: none !important;
                background: transparent !important;
                padding: 0 !important;
                resize: none !important;
                outline: none !important;
                box-shadow: none !important;
                overflow: hidden;
            }
        }
        
        /* Interactive styles for editable text fields */
        .print-editable {
            border: 1px dashed transparent;
            transition: all 0.2s;
        }
        .print-editable:hover, .print-editable:focus {
            border-color: #cbd5e1; /* tailwind slate-300 */
            background-color: #f8fafc; /* tailwind slate-50 */
            outline: none;
        }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useRef } = React;

        const Plus = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>;
        const Trash2 = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>;
        const Zap = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>;
        const Settings2 = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>;
        const Activity = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>;
        const ListOrdered = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="10" y1="6" x2="21" y2="6"></line><line x1="10" y1="12" x2="21" y2="12"></line><line x1="10" y1="18" x2="21" y2="18"></line><path d="M4 6h1v4"></path><path d="M4 10h2"></path><path d="M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"></path></svg>;
        const TableIcon = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3v18"></path><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M3 9h18"></path><path d="M3 15h18"></path></svg>;
        const Edit3 = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>;
        const Folder = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"></path></svg>;
        const ShieldAlert = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg>;
        const PrinterIcon = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>;
        const ImagePlus = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>;
        const Building = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect><path d="M9 22v-4h6v4"></path><path d="M8 6h.01"></path><path d="M16 6h.01"></path><path d="M12 6h.01"></path><path d="M12 10h.01"></path><path d="M12 14h.01"></path><path d="M16 10h.01"></path><path d="M16 14h.01"></path><path d="M8 10h.01"></path><path d="M8 14h.01"></path></svg>;
        const LinkIcon = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>;

        function App() {
          const [activeTab, setActiveTab] = useState('LIGHTING');
          const [settings, setSettings] = useState({ voltage: 230, powerFactor: 0.85 });
          
          // Data states initialized as EMPTY
          const [lightingGroups, setLightingGroups] = useState([]);
          const [powerLoads, setPowerLoads] = useState([]);

          // Print Headers State
          const [printHeaders, setPrintHeaders] = useState({
            reportTitle: "Electrical Load Estimation Report",
            reportSubtitle: "Sub-Distribution Board (SDB) Load Distribution",
            sysVoltageLabel: "System Voltage",
            pfLabel: "Power Factor",
            preparedBy: "Electrical Design Engineer",
            approvedBy: "Lead Engineering Consultant"
          });

          // Company & Client Info State
          const [companyInfo, setCompanyInfo] = useState({
            name: "Your Consultancy Name",
            address: "123 Engineering Ave, Tech City",
            logoUrl: "" 
          });
          
          const [clientInfo, setClientInfo] = useState({
            name: "Client Name",
            address: "Client Project Location",
            projectName: "Project Name"
          });

          const fileInputRef = useRef(null);

          const defaultGroups = ['Ground Floor', '1st Floor', 'Main DB', 'Sub DB-1'];

          const lightingDefaults = [
            { label: 'CF', full: 'CF (Ceiling Fan)', w: 80 },
            { label: 'TL', full: 'TL (Tube Light)', w: 40 },
            { label: 'CL', full: 'CL (Ceiling Light)', w: 20 },
            { label: 'WL', full: 'WL (Wall Light)', w: 20 },
            { label: 'ExF', full: 'ExF (Exhaust Fan)', w: 40 },
            { label: 'ChL', full: 'ChL (Chandelier)', w: 40 },
            { label: 'ML', full: 'ML (Mirror Light)', w: 10 },
            { label: '2-Pin', full: '2-Pin Socket', w: 200 }
          ];

          const powerDefaults = [
            { label: '3-Pin', full: '3-Pin Socket', w: 1000 },
            { label: 'AC', full: 'Air Conditioner', w: 1200 },
            { label: 'Geyser', full: 'Water Geyser', w: 1200 },
            { label: 'Motor', full: 'Water Pump/Motor', w: 1000 }
          ];

          const calculateCurrent = (wattage) => {
            if (!settings.voltage || !settings.powerFactor || wattage === 0) return 0;
            return (wattage / (settings.voltage * settings.powerFactor)).toFixed(2);
          };

          const updateSetting = (field, value) => setSettings({ ...settings, [field]: parseFloat(value) || 0 });
          
          // Handlers for Editable Text
          const updatePrintHeader = (field, value) => setPrintHeaders({ ...printHeaders, [field]: value });
          const updateCompanyInfo = (field, value) => setCompanyInfo({ ...companyInfo, [field]: value });
          const updateClientInfo = (field, value) => setClientInfo({ ...clientInfo, [field]: value });

          // Auto-resize textarea logic
          const handleTextareaResize = (e) => {
              e.target.style.height = 'auto';
              e.target.style.height = (e.target.scrollHeight) + 'px';
          };

          const handleLogoUpload = (e) => {
              const file = e.target.files[0];
              if (file) {
                  const reader = new FileReader();
                  reader.onloadend = () => {
                      setCompanyInfo({...companyInfo, logoUrl: reader.result});
                  };
                  reader.readAsDataURL(file);
              }
          };

          const removeLogo = () => {
              setCompanyInfo({...companyInfo, logoUrl: ""});
              if(fileInputRef.current) fileInputRef.current.value = "";
          };

          const addGroup = () => {
            setLightingGroups([...lightingGroups, { id: `g-${Date.now()}`, name: `Group-${lightingGroups.length + 1}`, boards: [] }]);
          };

          const updateGroupName = (groupId, name) => {
            setLightingGroups(lightingGroups.map(g => g.id === groupId ? { ...g, name } : g));
          };

          const deleteGroup = (groupId) => {
            setLightingGroups(lightingGroups.filter(g => g.id !== groupId));
            setPowerLoads(powerLoads.filter(pl => !(pl.type === 'GROUP' && pl.refId === groupId)));
          };

          const addBoard = (groupId) => {
            setLightingGroups(lightingGroups.map(g => {
              if (g.id === groupId) {
                return { ...g, boards: [...g.boards, { id: `sb-${Date.now()}`, name: `Switchboard ${g.boards.length + 1}`, points: [] }] };
              }
              return g;
            }));
          };

          const updateBoardName = (groupId, boardId, name) => {
            setLightingGroups(lightingGroups.map(g => {
              if (g.id === groupId) {
                return { ...g, boards: g.boards.map(b => b.id === boardId ? { ...b, name } : b) };
              }
              return g;
            }));
          };

          const deleteBoard = (groupId, boardId) => {
            setLightingGroups(lightingGroups.map(g => g.id === groupId ? { ...g, boards: g.boards.filter(b => b.id !== boardId) } : g));
          };

          const addLightingPoint = (groupId, boardId, defaultName = 'New Point', defaultWatt = 0) => {
            setLightingGroups(lightingGroups.map(g => g.id === groupId ? {
              ...g, boards: g.boards.map(b => b.id === boardId ? {
                ...b, points: [...b.points, { id: `p-${Date.now()}`, name: defaultName, qty: 1, watt: defaultWatt }]
              } : b)
            } : g));
          };

          const updateLightingPoint = (groupId, boardId, pointId, field, value) => {
            setLightingGroups(lightingGroups.map(g => g.id === groupId ? {
              ...g, boards: g.boards.map(b => b.id === boardId ? {
                ...b, points: b.points.map(p => p.id === pointId ? { ...p, [field]: field === 'name' ? value : (parseFloat(value) || 0) } : p)
              } : b)
            } : g));
          };

          const deleteLightingPoint = (groupId, boardId, pointId) => {
            setLightingGroups(lightingGroups.map(g => g.id === groupId ? {
              ...g, boards: g.boards.map(b => b.id === boardId ? { ...b, points: b.points.filter(p => p.id !== pointId) } : b)
            } : g));
          };

          const addPowerLoad = (defaultName = 'New Power Load', defaultWatt = 0) => {
            setPowerLoads([...powerLoads, { id: `pl-${Date.now()}`, type: 'CUSTOM', name: defaultName, qty: 1, watt: defaultWatt, diversity: 1.0 }]);
          };

          const addGroupToPowerLoads = (groupId) => {
            if(powerLoads.some(pl => pl.type === 'GROUP' && pl.refId === groupId)) return;
            setPowerLoads([...powerLoads, { 
                id: `pl-${Date.now()}`, 
                type: 'GROUP', 
                refId: groupId, 
                name: '', // Display name handled dynamically
                qty: 1, 
                watt: 0, 
                diversity: 0.8 
            }]);
          };

          const updatePowerLoad = (plId, field, value) => {
            setPowerLoads(powerLoads.map(pl => pl.id === plId ? { ...pl, [field]: field === 'name' ? value : (parseFloat(value) || 0) } : pl));
          };

          const deletePowerLoad = (plId) => setPowerLoads(powerLoads.filter(pl => pl.id !== plId));
          const handlePrint = () => window.print();

          const { lightingGroupsList, lightingGroupsMap, totalConnectedLighting } = useMemo(() => {
            let total = 0;
            const map = {};
            
            lightingGroups.forEach(g => {
              let gTotal = 0;
              const boardsWithTotals = g.boards.map(b => {
                const bTotal = b.points.reduce((sum, p) => sum + (p.qty * p.watt), 0);
                gTotal += bTotal;
                return { ...b, totalWatt: bTotal, current: calculateCurrent(bTotal) };
              });
              
              total += gTotal;
              map[g.id] = { id: g.id, name: g.name, boards: boardsWithTotals, totalWatt: gTotal, current: calculateCurrent(gTotal) };
            });

            return {
              lightingGroupsList: lightingGroups.map(g => map[g.id]),
              lightingGroupsMap: map,
              totalConnectedLighting: total
            };
          }, [lightingGroups, settings]);

          const { processedPowerLoads, totalDesignPower, finalTotalCurrent } = useMemo(() => {
            let totalW = 0;
            const processed = powerLoads.map(pl => {
                let currentWatt = pl.watt;
                let displayName = pl.name;
                
                if (pl.type === 'GROUP') {
                    const groupData = lightingGroupsMap[pl.refId];
                    currentWatt = groupData ? groupData.totalWatt : 0;
                    displayName = groupData ? `${groupData.name} (Lighting Load)` : 'Deleted Group';
                }
                
                const finalW = pl.qty * currentWatt * pl.diversity;
                totalW += finalW;
                return { ...pl, displayWatt: currentWatt, displayName, finalWatt: finalW };
            });

            return {
                processedPowerLoads: processed,
                totalDesignPower: totalW,
                finalTotalCurrent: calculateCurrent(totalW)
            };
          }, [powerLoads, lightingGroupsMap, settings]);

          return (
            <div className="min-h-screen font-sans text-slate-800 pb-24 bg-slate-100">
              {/* Header - Hidden on Print */}
              <header className="bg-indigo-900 text-white shadow-md sticky top-0 z-20 no-print">
                <div className="max-w-6xl mx-auto px-4 py-4 sm:px-6 lg:px-8">
                  <div className="flex flex-col md:flex-row justify-between items-center gap-4">
                    <div className="flex items-center gap-3">
                      <Zap className="w-8 h-8 text-amber-400" />
                      <div>
                        <h1 className="text-xl font-bold tracking-wide">Pro Load Estimator</h1>
                        <p className="text-xs text-indigo-300">Electrical Load & SDB Schedule Planner</p>
                      </div>
                    </div>

                    <div className="flex bg-indigo-950 rounded-lg p-1 border border-indigo-800 overflow-x-auto w-full md:w-auto">
                      <button onClick={() => setActiveTab('LIGHTING')} className={`flex items-center whitespace-nowrap gap-2 px-3 py-2 rounded-md text-sm font-medium transition-colors ${activeTab === 'LIGHTING' ? 'bg-indigo-600 text-white shadow' : 'text-indigo-300 hover:text-white'}`}><Edit3 className="w-4 h-4" /> Lighting (SB)</button>
                      <button onClick={() => setActiveTab('POWER')} className={`flex items-center whitespace-nowrap gap-2 px-3 py-2 rounded-md text-sm font-medium transition-colors ${activeTab === 'POWER' ? 'bg-indigo-600 text-white shadow' : 'text-indigo-300 hover:text-white'}`}><ShieldAlert className="w-4 h-4" /> Power (SDB)</button>
                      <button onClick={() => setActiveTab('SUMMARY')} className={`flex items-center whitespace-nowrap gap-2 px-3 py-2 rounded-md text-sm font-medium transition-colors ${activeTab === 'SUMMARY' ? 'bg-indigo-600 text-white shadow' : 'text-indigo-300 hover:text-white'}`}><TableIcon className="w-4 h-4" /> Summary & Print</button>
                    </div>
                    
                    <div className="flex items-center gap-4 bg-indigo-800 p-2 rounded-lg border border-indigo-700 shadow-inner">
                      <div className="flex items-center gap-2">
                        <label className="text-xs font-medium text-indigo-200 uppercase tracking-wider">Volts</label>
                        <input type="number" value={settings.voltage} onChange={(e) => updateSetting('voltage', e.target.value)} className="w-16 px-2 py-1 bg-white text-indigo-900 rounded focus:outline-none focus:ring-2 focus:ring-amber-400 text-sm font-semibold text-center"/>
                      </div>
                      <div className="w-px h-6 bg-indigo-600"></div>
                      <div className="flex items-center gap-2">
                        <label className="text-xs font-medium text-indigo-200 uppercase tracking-wider">PF</label>
                        <input type="number" step="0.01" value={settings.powerFactor} onChange={(e) => updateSetting('powerFactor', e.target.value)} className="w-16 px-2 py-1 bg-white text-indigo-900 rounded focus:outline-none focus:ring-2 focus:ring-amber-400 text-sm font-semibold text-center"/>
                      </div>
                    </div>
                  </div>
                </div>
              </header>

              <main className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                
                {activeTab === 'LIGHTING' && (
                  <div className="space-y-8 no-print">
                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-5 flex justify-between items-center">
                      <div>
                        <h2 className="text-lg font-bold text-slate-800">Lighting Connected Load Builder</h2>
                        <p className="text-sm text-slate-500">Create Groups. Add Switchboards under them.</p>
                      </div>
                      <button onClick={addGroup} className="bg-indigo-600 text-white px-4 py-2 rounded-lg font-medium shadow-sm hover:bg-indigo-700 flex items-center gap-2">
                        <Plus className="w-4 h-4" /> Add Group
                      </button>
                    </div>

                    {lightingGroupsList.length === 0 && (
                      <div className="text-center py-16 bg-white border-2 border-dashed border-slate-300 rounded-xl">
                        <Folder className="w-12 h-12 text-slate-300 mx-auto mb-3" />
                        <p className="text-slate-500 font-medium">No groups created yet.</p>
                        <p className="text-slate-400 text-sm">Click the "Add Group" button above to start.</p>
                      </div>
                    )}

                    {lightingGroupsList.map((group, gIndex) => (
                      <div key={group.id} className="bg-indigo-50 border border-indigo-200 rounded-2xl overflow-hidden shadow-sm">
                        <div className="bg-indigo-100/70 p-4 border-b border-indigo-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                           <div className="flex items-center gap-3 w-full md:w-auto">
                              <Folder className="w-6 h-6 text-indigo-600" />
                              <input 
                                type="text" 
                                value={group.name} 
                                onChange={(e) => updateGroupName(group.id, e.target.value)} 
                                className="bg-white border border-indigo-300 px-3 py-1.5 rounded-lg font-bold text-indigo-900 focus:outline-none focus:border-indigo-600 w-full sm:w-64 shadow-sm" 
                              />
                           </div>
                           <div className="flex items-center gap-6">
                              <div className="text-right">
                                <span className="text-[10px] text-indigo-500 uppercase font-bold tracking-wider block">Group Connected Load</span>
                                <span className="text-xl font-bold text-indigo-900">{group.totalWatt} W</span>
                              </div>
                              <button onClick={() => deleteGroup(group.id)} className="text-red-500 hover:text-red-700 bg-white p-2 rounded-lg shadow-sm border border-red-100 flex items-center gap-1 text-sm font-medium shrink-0">
                                <Trash2 className="w-4 h-4" /> <span className="hidden sm:inline">Delete Group</span>
                              </button>
                           </div>
                        </div>

                        <div className="p-4 sm:p-6 space-y-6">
                          {group.boards.length === 0 ? (
                            <div className="text-center py-6 text-indigo-400 italic">No switchboards in this group. Click 'Add Switchboard' below.</div>
                          ) : (
                            group.boards.map((board, bIndex) => (
                              <div key={board.id} className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                                <div className="bg-slate-50 px-4 py-3 border-b border-slate-200 flex justify-between items-center">
                                  <div className="flex items-center gap-3">
                                    <div className="bg-indigo-600 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold shrink-0">{bIndex + 1}</div>
                                    <input 
                                      type="text" 
                                      value={board.name} 
                                      onChange={(e) => updateBoardName(group.id, board.id, e.target.value)} 
                                      className="bg-white border border-slate-300 px-3 py-1 rounded text-sm font-semibold text-slate-700 focus:outline-none focus:border-indigo-500 w-48" 
                                    />
                                  </div>
                                  <button onClick={() => deleteBoard(group.id, board.id)} className="text-slate-400 hover:text-red-600 p-1.5"><Trash2 className="w-4 h-4" /></button>

                                  <div className="space-y-2 mb-4">
                                    {board.points.map(point => (

                                        <div className="col-span-5 w-full">
                                          <input type="text" value={point.name} onChange={(e) => updateLightingPoint(group.id, board.id, point.id, 'name', e.target.value)} className="w-full border border-slate-300 rounded px-2 py-1.5 text-sm focus:outline-none focus:border-indigo-500 bg-white" placeholder="Point Name" />
                                        </div>
                                        <div className="col-span-4 w-full flex gap-2 sm:contents">
                                          <input type="number" min="1" value={point.qty || ''} onChange={(e) => updateLightingPoint(group.id, board.id, point.id, 'qty', e.target.value)} className="w-full border border-slate-300 rounded px-2 py-1.5 text-sm text-center bg-white" placeholder="Qty" title="Quantity" />
                                          <input type="number" min="0" value={point.watt === 0 && point.watt !== '0' ? '' : point.watt} onChange={(e) => updateLightingPoint(group.id, board.id, point.id, 'watt', e.target.value)} className="w-full border border-slate-300 rounded px-2 py-1.5 text-sm text-center bg-white" placeholder="Watt" title="Watt/Unit" />
                                        </div>
                                        <div className="col-span-3 w-full flex items-center justify-between sm:contents">
                                          <div className="col-span-2 text-right font-bold text-indigo-700 w-full pr-4 text-sm">{(point.qty * point.watt) || 0} W</div>
                                          <button onClick={() => deleteLightingPoint(group.id, board.id, point.id)} className="p-1.5 text-slate-400 hover:text-red-500"><Trash2 className="w-3.5 h-3.5" /></button>
                                        </div>
                                      </div>
                                    ))}
                                  </div>
                                  <div className="flex flex-wrap items-center gap-2 pt-2 border-t border-slate-100">
                                    <span className="text-xs font-medium text-slate-400 mr-2">Quick Add:</span>
                                    {lightingDefaults.map(item => (
                                      <button key={item.label} onClick={() => addLightingPoint(group.id, board.id, item.full, item.w)} className="px-2 py-1 bg-slate-100 hover:bg-indigo-50 hover:text-indigo-700 rounded text-xs font-medium text-slate-600 transition border border-slate-200">{item.label}</button>
                                    ))}
                                    <button onClick={() => addLightingPoint(group.id, board.id, '', 0)} className="flex items-center gap-1 px-2 py-1 bg-indigo-50 text-indigo-700 border border-indigo-200 rounded text-xs font-bold hover:bg-indigo-100 transition"><Plus className="w-3 h-3" /> Custom</button>
                                  </div>
                                </div>
                                <div className="bg-slate-50 px-4 py-2 flex justify-end gap-6 border-t border-slate-100">
                                   <div className="text-xs font-semibold text-slate-500">SB Subtotal: <span className="text-indigo-700 text-sm ml-1">{board.totalWatt} W</span></div>
                                </div>
                              </div>
                            ))
                          )}
                          
                          <button onClick={() => addBoard(group.id)} className="w-full py-3 border-2 border-dashed border-indigo-300 text-indigo-600 font-semibold rounded-xl hover:bg-indigo-100 transition flex items-center justify-center gap-2 text-sm bg-white">
                            <Plus className="w-4 h-4" /> Add Switchboard in {group.name}
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}

                {activeTab === 'POWER' && (
                  <div className="space-y-6 no-print">
                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                      <div className="bg-emerald-800 text-white p-5">
                        <h2 className="text-xl font-bold flex items-center gap-2"><ShieldAlert className="w-5 h-5 text-emerald-300"/> SDB Power Loads & Group Linking</h2>
                        <p className="text-sm text-emerald-100">Link your lighting groups here and add custom power loads to build the final SDB load.</p>
                      </div>

                      <div className="bg-emerald-50 border-b border-emerald-100 p-5">
                        <h3 className="text-sm font-bold text-emerald-800 mb-3 flex items-center gap-2"><LinkIcon className="w-4 h-4" /> Link Lighting Groups (from SB Tab)</h3>
                        <div className="flex flex-wrap gap-3">
                          {lightingGroupsList.length === 0 && <span className="text-sm text-emerald-600 italic">No groups created in Lighting tab yet.</span>}
                          {lightingGroupsList.map(g => {
                            const isAdded = powerLoads.some(pl => pl.type === 'GROUP' && pl.refId === g.id);
                            return (
                              <button
                                key={g.id}
                                onClick={() => !isAdded && addGroupToPowerLoads(g.id)}
                                disabled={isAdded}
                                className={`px-4 py-2 rounded-md text-sm font-bold transition border shadow-sm flex items-center gap-2 ${
                                  isAdded 
                                    ? 'bg-slate-200 text-slate-400 border-slate-300 cursor-not-allowed' 
                                    : 'bg-white hover:bg-emerald-100 hover:text-emerald-800 text-emerald-700 border-emerald-300'
                                }`}
                              >
                                {isAdded ? `✓ ${g.name} (Linked)` : `+ Link ${g.name} (${g.totalWatt}W)`}
                              </button>
                            );
                          })}
                        </div>
                      </div>

                      <div className="p-4 sm:p-6">
                        <div className="space-y-3 mb-6">
                          <div className="hidden sm:grid grid-cols-12 gap-4 text-xs font-semibold text-slate-500 uppercase tracking-wider px-2">
                            <div className="col-span-4">Load Item / Group Name</div>
                            <div className="col-span-2 text-center">Qty</div>
                            <div className="col-span-2 text-center">Base Watt</div>
                            <div className="col-span-2 text-center text-emerald-600">Diversity (DF)</div>
                            <div className="col-span-1 text-right">Final W</div>
                            <div className="col-span-1 text-center">Act</div>
                          </div>

                          {processedPowerLoads.length === 0 && (
                            <div className="text-center py-8 text-slate-400">No loads added to SDB yet. Link a group above or add a custom load.</div>
                          )}

                          {processedPowerLoads.map(pl => {
                            const isGroup = pl.type === 'GROUP';
                            return (
                              <div key={pl.id} className={`flex flex-col sm:grid sm:grid-cols-12 gap-2 sm:gap-4 items-center p-3 sm:p-2 rounded-lg sm:rounded-none border sm:border-none ${isGroup ? 'bg-indigo-50/50 border-indigo-100' : 'bg-emerald-50/50 border-emerald-100'}`}>
                                <div className="col-span-4 w-full">
                                  <label className="sm:hidden text-[10px] text-slate-400 uppercase font-bold mb-1 block">Item Name</label>
                                  <input 
                                    type="text" 
                                    value={pl.displayName} 
                                    onChange={(e) => !isGroup && updatePowerLoad(pl.id, 'name', e.target.value)} 
                                    disabled={isGroup}
                                    className={`w-full border rounded px-3 py-2 text-sm focus:outline-none ${isGroup ? 'bg-transparent border-transparent font-semibold text-indigo-800' : 'bg-white border-slate-300 focus:border-emerald-500'}`} 
                                  />
                                </div>
                                <div className="col-span-6 w-full flex gap-2 sm:contents">
                                  <input 
                                    type="number" min="1" value={pl.qty || ''} 
                                    onChange={(e) => !isGroup && updatePowerLoad(pl.id, 'qty', e.target.value)} 
                                    disabled={isGroup}
                                    className={`w-full border rounded px-2 py-2 text-sm text-center ${isGroup ? 'bg-transparent border-transparent text-indigo-800 font-bold' : 'bg-white border-slate-300 focus:border-emerald-500'}`} 
                                  />
                                  <input 
                                    type="number" min="0" value={pl.displayWatt === 0 && pl.displayWatt !== '0' ? '' : pl.displayWatt} 
                                    onChange={(e) => !isGroup && updatePowerLoad(pl.id, 'watt', e.target.value)} 
                                    disabled={isGroup}
                                    className={`w-full border rounded px-2 py-2 text-sm text-center ${isGroup ? 'bg-transparent border-transparent text-indigo-800 font-bold' : 'bg-white border-slate-300 focus:border-emerald-500'}`} 
                                  />
                                  <input 
                                    type="number" step="0.05" min="0" max="1" value={pl.diversity} 
                                    onChange={(e) => updatePowerLoad(pl.id, 'diversity', e.target.value)} 
                                    className="w-full border border-emerald-300 bg-white text-emerald-900 font-bold rounded px-2 py-2 text-sm text-center focus:outline-none shadow-inner" 
                                    title="Diversity Factor (0 to 1)"
                                  />
                                </div>
                                <div className="col-span-2 w-full flex items-center justify-between sm:contents">
                                  <div className="col-span-1 text-right font-bold text-emerald-700 w-full pr-2">{pl.finalWatt.toFixed(1)} W</div>
                                  <button onClick={() => deletePowerLoad(pl.id)} className="p-2 text-slate-400 hover:text-red-500"><Trash2 className="w-4 h-4" /></button>
                                </div>
                              </div>
                            );
                          })}
                        </div>
                        <div className="flex flex-wrap items-center gap-2 border-t border-slate-100 pt-4">
                          <span className="text-sm font-medium text-slate-500 mr-2">Add Custom SDB Load:</span>
                          {powerDefaults.map(item => (
                            <button key={item.label} onClick={() => addPowerLoad(item.full, item.w)} className="px-3 py-1.5 bg-slate-100 hover:bg-emerald-100 hover:text-emerald-800 rounded text-sm font-medium text-slate-700 transition border border-slate-200">+ {item.label}</button>
                          ))}
                          <button onClick={() => addPowerLoad('', 0)} className="flex items-center gap-1 px-3 py-1.5 bg-slate-100 text-slate-700 border border-slate-300 rounded text-sm font-bold hover:bg-slate-200 transition"><Plus className="w-3 h-3" /> Custom</button>
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {activeTab === 'SUMMARY' && (
                  <div className="space-y-6">
                    {/* Print controls - hidden when printing */}
                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-4 no-print flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                      <div className="text-sm text-slate-500">
                        <p><strong className="text-indigo-600">Tip:</strong> Click on any text in the header section below to edit it before printing.</p>
                      </div>
                      <button onClick={handlePrint} className="flex items-center gap-2 px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-bold shadow-md transition w-full md:w-auto justify-center">
                        <PrinterIcon className="w-5 h-5" /> Print Report (A4 PDF)
                      </button>
                    </div>

                    <div className="bg-white rounded-xl shadow-md border border-slate-200 p-8 print-area relative">
                      
                      {/* Document Header with Company & Client Info */}
                      <div className="flex justify-between items-start mb-8 border-b-2 border-slate-800 pb-6">
                        
                        {/* Company Logo and Info */}
                        <div className="flex items-start gap-4 w-1/2 pr-4">
                          <div className="relative group shrink-0">
                            {companyInfo.logoUrl ? (
                                <div>
                                    <img src={companyInfo.logoUrl} alt="Company Logo" className="h-20 w-20 object-contain border border-slate-200 rounded" />
                                    <button onClick={removeLogo} className="absolute -top-2 -right-2 bg-red-500 text-white rounded-full p-1 opacity-0 group-hover:opacity-100 transition no-print"><Trash2 className="w-3 h-3"/></button>
                                </div>
                            ) : (
                                <div className="h-20 w-20 bg-slate-100 border-2 border-dashed border-slate-300 rounded flex flex-col items-center justify-center text-slate-400 no-print hover:bg-slate-200 cursor-pointer" onClick={() => fileInputRef.current.click()}>
                                    <ImagePlus className="w-6 h-6 mb-1" />
                                    <span className="text-[10px]">Add Logo</span>
                                </div>
                            )}
                            <input type="file" accept="image/*" ref={fileInputRef} onChange={handleLogoUpload} className="hidden" />
                          </div>
                          
                          <div className="flex flex-col w-full">
                            <input 
                                type="text" 
                                value={companyInfo.name} 
                                onChange={(e) => updateCompanyInfo('name', e.target.value)}
                                className="print-editable text-xl font-bold text-slate-900 w-full"
                                placeholder="Consultancy Name"
                            />
                            <textarea 
                                value={companyInfo.address}
                                onChange={(e) => { updateCompanyInfo('address', e.target.value); handleTextareaResize(e); }}
                                className="print-editable text-sm text-slate-600 w-full resize-none overflow-hidden"
                                placeholder="Consultancy Address"
                                rows="2"
                                onFocus={handleTextareaResize}
                            />
                          </div>
                        </div>

                        {/* Client Info */}
                        <div className="flex flex-col items-end text-right w-1/2 pl-4 border-l border-slate-200">
                          <div className="flex items-center gap-2 text-slate-500 mb-1">
                              <Building className="w-4 h-4" />
                              <span className="text-xs font-bold uppercase tracking-wider">Client Details</span>
                          </div>
                          <input 
                              type="text" 
                              value={clientInfo.projectName} 
                              onChange={(e) => updateClientInfo('projectName', e.target.value)}
                              className="print-editable text-lg font-bold text-indigo-900 w-full text-right"
                              placeholder="Project Name"
                          />
                          <input 
                              type="text" 
                              value={clientInfo.name} 
                              onChange={(e) => updateClientInfo('name', e.target.value)}
                              className="print-editable text-md font-semibold text-slate-700 w-full text-right"
                              placeholder="Client Name"
                          />
                          <textarea 
                              value={clientInfo.address}
                              onChange={(e) => { updateClientInfo('address', e.target.value); handleTextareaResize(e); }}
                              className="print-editable text-sm text-slate-500 w-full text-right resize-none overflow-hidden"
                              placeholder="Project Address"
                              rows="2"
                              onFocus={handleTextareaResize}
                          />
                          <div className="text-xs text-slate-400 mt-2">Date: {new Date().toLocaleDateString()}</div>
                        </div>
                      </div>

                      {/* Report Titles & Settings */}
                      <div className="mb-6 flex flex-col md:flex-row justify-between items-end gap-4">
                        <div className="w-full md:w-2/3">
                          <input 
                            type="text" 
                            value={printHeaders.reportTitle} 
                            onChange={(e) => updatePrintHeader('reportTitle', e.target.value)}
                            className="print-editable text-2xl font-bold tracking-tight text-slate-900 uppercase w-full block"
                          />
                          <input 
                            type="text" 
                            value={printHeaders.reportSubtitle} 
                            onChange={(e) => updatePrintHeader('reportSubtitle', e.target.value)}
                            className="print-editable text-sm text-slate-500 w-full block"
                          />
                        </div>
                        <div className="text-right border border-slate-300 p-3 rounded text-sm bg-slate-50 w-full md:w-auto">
                          <div className="flex items-center justify-end gap-2 mb-1">
                            <input 
                                type="text" 
                                value={printHeaders.sysVoltageLabel} 
                                onChange={(e) => updatePrintHeader('sysVoltageLabel', e.target.value)}
                                className="print-editable font-bold text-right w-32"
                            />
                            <span>: {settings.voltage} V</span>
                          </div>
                          <div className="flex items-center justify-end gap-2">
                            <input 
                                type="text" 
                                value={printHeaders.pfLabel} 
                                onChange={(e) => updatePrintHeader('pfLabel', e.target.value)}
                                className="print-editable font-bold text-right w-32"
                            />
                            <span>: {settings.powerFactor}</span>
                          </div>
                        </div>
                      </div>

                      <table className="w-full text-left border-collapse border border-slate-300 text-sm">
                        <thead>
                          <tr className="bg-slate-800 text-white uppercase text-xs tracking-wider border border-slate-300">
                            <th className="p-3 border border-slate-300">Location / Distribution Group</th>
                            <th className="p-3 border border-slate-300">Switchboard & Point Details</th>
                            <th className="p-3 text-center border border-slate-300 w-24">Connected Qty</th>
                            <th className="p-3 text-right border border-slate-300 w-32">Connected Load (W)</th>
                            <th className="p-3 text-right border border-slate-300 w-32">Est. Current (A)</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-300">
                          
                          {/* --- Section 1: Connected Loads Details --- */}
                          <tr className="bg-slate-100 font-bold text-slate-900">
                            <td colSpan="5" className="p-3 border border-slate-300 uppercase text-xs tracking-wide">
                              1. Group Details (Connected Loads before Diversity)
                            </td>
                          </tr>

                          {lightingGroupsList.length === 0 ? (
                            <tr><td colSpan="5" className="p-4 text-center italic border border-slate-300">No connected loads recorded.</td></tr>
                          ) : (
                            lightingGroupsList.map((group, gIndex) => (
                              <React.Fragment key={`P-L-${gIndex}`}>
                                <tr className="bg-indigo-50/40 font-semibold text-indigo-900">
                                  <td className="p-2 px-3 border border-slate-300" colSpan="5">📁 {group.name} <span className="float-right text-xs">Total: {group.totalWatt} W</span></td>
                                </tr>
                                {group.boards.map((b, bIndex) => (
                                  <React.Fragment key={`B-${bIndex}`}>
                                    <tr className="bg-slate-50 text-slate-700 font-medium">
                                      <td className="p-2 pl-6 border border-slate-300 text-xs text-slate-400">↳</td>
                                      <td className="p-2 border border-slate-300 font-bold text-slate-800 text-xs">{b.name}</td>
                                      <td className="p-2 text-center border border-slate-300 text-xs">{b.points.length} Items</td>
                                      <td className="p-2 text-right border border-slate-300 font-semibold text-xs">{b.totalWatt} W</td>
                                      <td className="p-2 text-right border border-slate-300 font-semibold text-xs">{b.current} A</td>
                                    </tr>
                                    {b.points.map((p, pIndex) => (
                                      <tr key={`pt-${pIndex}`} className="text-slate-600 text-xs italic">
                                        <td className="p-1 pl-10 border border-slate-200"></td>
                                        <td className="p-1 pl-4 border border-slate-200">- {p.name} ({p.watt}W/unit)</td>
                                        <td className="p-1 text-center border border-slate-200">{p.qty}</td>
                                        <td className="p-1 text-right border border-slate-200">{p.qty * p.watt} W</td>
                                        <td className="p-1 text-right border border-slate-200">{calculateCurrent(p.qty * p.watt)} A</td>
                                      </tr>
                                    ))}
                                  </React.Fragment>
                                ))}
                              </React.Fragment>
                            ))
                          )}
                          
                          <tr className="bg-slate-100 text-slate-500 italic text-[10px]">
                            <td colSpan="5" className="p-2 text-center border border-slate-300">Note: The above connected loads do not automatically add to the final calculation unless linked to the SDB with a Diversity Factor.</td>
                          </tr>

                          {/* --- Section 2: Final Power Load Integration --- */}
                          <tr className="bg-emerald-100 font-bold text-emerald-900 border-t-4 border-slate-800">
                            <td colSpan="5" className="p-3 border border-slate-300 uppercase text-xs tracking-wide">
                              2. SDB Design Load (Linked Groups & Custom Loads)
                            </td>
                          </tr>
                          <tr className="bg-emerald-50 text-[10px] font-bold text-emerald-700 uppercase tracking-wider">
                            <td className="p-2 border border-slate-300">SDB Point Type</td>
                            <td className="p-2 border border-slate-300">Item Name</td>
                            <td className="p-2 text-center border border-slate-300">Qty</td>
                            <td className="p-2 text-right border border-slate-300">Final Design Load (DF Applied)</td>
                            <td className="p-2 text-right border border-slate-300">Est. Current</td>
                          </tr>

                          {processedPowerLoads.length === 0 ? (
                            <tr><td colSpan="5" className="p-4 text-center italic border border-slate-300">No loads added to SDB.</td></tr>
                          ) : (
                            processedPowerLoads.map((pl, pIndex) => {
                              const isGroup = pl.type === 'GROUP';
                              return (
                                <tr key={`P-summary-${pIndex}`} className={`hover:bg-slate-50 transition-colors text-xs ${isGroup ? 'font-semibold text-indigo-900' : 'text-slate-800'}`}>
                                  <td className="p-3 border border-slate-300 text-slate-500 font-medium">{isGroup ? '🔗 Linked Group' : '⚡ Power Point'}</td>
                                  <td className="p-3 border border-slate-300">
                                    {pl.displayName} <span className="ml-2 font-normal text-slate-400 bg-white px-1.5 py-0.5 rounded border border-slate-200">DF: {pl.diversity} (Base: {pl.displayWatt}W)</span>
                                  </td>
                                  <td className="p-3 text-center border border-slate-300 font-medium">{pl.qty}</td>
                                  <td className="p-3 text-right border border-slate-300 font-bold text-emerald-700">{pl.finalWatt.toFixed(1)} W</td>
                                  <td className="p-3 text-right border border-slate-300 font-bold text-emerald-700">{calculateCurrent(pl.finalWatt)} A</td>
                                </tr>
                              )
                            })
                          )}

                          {/* --- GRAND TOTAL ROW --- */}
                          <tr className="bg-slate-900 text-white font-extrabold text-md uppercase">
                            <td colSpan="3" className="p-4 text-right tracking-wide">Grand Total Ultimate SDB Load:</td>
                            <td className="p-4 text-right border border-slate-700 text-amber-400">{totalDesignPower.toFixed(1)} W</td>
                            <td className="p-4 text-right border border-slate-700 text-cyan-300">{finalTotalCurrent} A</td>
                          </tr>

                        </tbody>
                      </table>

                      {/* Engineering Sign-off Box */}
                      <div className="mt-20 grid grid-cols-2 gap-16 text-center text-sm text-slate-600">
                        <div className="border-t border-slate-400 pt-3">
                          <input 
                            type="text" 
                            value={printHeaders.preparedBy} 
                            onChange={(e) => updatePrintHeader('preparedBy', e.target.value)}
                            className="print-editable font-bold uppercase text-slate-800 w-full text-center"
                          />
                        </div>
                        <div className="border-t border-slate-400 pt-3">
                          <input 
                            type="text" 
                            value={printHeaders.approvedBy} 
                            onChange={(e) => updatePrintHeader('approvedBy', e.target.value)}
                            className="print-editable font-bold uppercase text-slate-800 w-full text-center"
                          />
                        </div>
                      </div>
                    </div>
                  </div>
                )}
              </main>

              {/* Sticky Footer Tracker - Final SDB Load */}
              <div className="fixed bottom-0 left-0 w-full bg-slate-900 text-white shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] z-30 no-print">
                <div className="max-w-6xl mx-auto px-4 py-3 sm:px-6 lg:px-8 flex flex-col sm:flex-row justify-between items-center gap-4">
                  <div className="flex items-center gap-2">
                    <Activity className="w-5 h-5 text-yellow-400" />
                    <span className="font-semibold text-lg text-yellow-50 tracking-wide">FINAL SDB DESIGN LOAD</span>
                  </div>
                  
                  <div className="flex items-center justify-between sm:justify-end gap-6 sm:gap-8 overflow-x-auto w-full sm:w-auto pb-2 sm:pb-0">
                    <div className="flex flex-col items-center sm:items-end min-w-max">
                      <span className="text-[10px] text-slate-400 uppercase tracking-widest font-bold">Total Final Power</span>
                      <div className="flex items-center gap-1.5">
                        <Zap className="w-5 h-5 text-amber-400" />
                        <span className="text-2xl font-bold text-amber-400">{totalDesignPower.toFixed(1)} <span className="text-sm font-normal">W</span></span>
                      </div>
                    </div>
                    <div className="w-px h-10 bg-slate-700"></div>
                    <div className="flex flex-col items-center sm:items-end min-w-max">
                      <span className="text-[10px] text-slate-400 uppercase tracking-widest font-bold">Total Final Current</span>
                      <div className="flex items-center gap-1.5">
                        <Activity className="w-5 h-5 text-blue-400" />
                        <span className="text-2xl font-bold text-blue-400">{finalTotalCurrent} <span className="text-sm font-normal">A</span></span>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
