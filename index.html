                        <PrinterIcon className="w-4 h-4" /> Print Document
                      </button>
                      <button onClick={() => setSaveModalOpen(true)} className="shrink-0 flex items-center gap-2 px-6 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg font-bold shadow transition w-full md:w-auto justify-center">
                        <SaveIcon className="w-4 h-4" /> Save to Cloud
                      </button>
                    </div>

                    <div className="bg-white shadow border border-slate-200 p-8 print-area">
                      
                      {/* Company Header */}
                      <div className="flex justify-between items-start mb-6">
                        <div className="flex items-center gap-4">
                          {companyInfo.logoUrl && <img src={companyInfo.logoUrl} alt="Logo" className="h-16 w-16 object-contain" />}
                          <div>
                            <h2 className="text-xl font-bold text-slate-900">{companyInfo.name || "Company Name"}</h2>
                            <p className="text-xs text-slate-500 whitespace-pre-line">{companyInfo.address || "Company Address"}</p>
                          </div>
                        </div>
                        <div className="text-right text-sm">
                          <div className="bg-slate-50 border p-2">
                             <div><strong>System Voltage:</strong> {settings.voltage}V</div>
                             <div><strong>Power Factor:</strong> {settings.powerFactor}</div>
                          </div>
                        </div>
                      </div>

                      {/* Document Titles */}
                      <div className="border-b-2 border-slate-800 pb-4 mb-6 flex justify-between items-end">
                        <div className="w-2/3">
                          <input type="text" value={printHeaders.reportTitle} onChange={(e) => updatePrintHeader('reportTitle', e.target.value)} className="print-editable text-2xl font-bold tracking-tight text-slate-900 uppercase w-full block" />
                          <div className="flex items-center text-slate-600 mt-1">
                             <input type="text" value={printHeaders.reportSubtitle} onChange={(e) => updatePrintHeader('reportSubtitle', e.target.value)} className="print-editable text-sm w-auto mr-1" />
                             <span className="text-sm font-bold text-slate-800 bg-slate-100 px-2 py-0.5 rounded border border-slate-200">({reportSdbName})</span>
                          </div>
                        </div>
                        <div className="text-right text-xs text-slate-600">
                           <p><strong>Project:</strong> {clientInfo.projectName || "N/A"}</p>
                           <p><strong>Client:</strong> {clientInfo.name || "N/A"}</p>
                           <p className="whitespace-pre-line">{clientInfo.address}</p>
                        </div>
                      </div>

                      {/* Main Table */}
                      <table className="w-full text-left border-collapse border border-slate-300 text-sm mb-12">
                        <thead>
                          <tr className="bg-slate-100 text-slate-800 uppercase text-xs tracking-wider border border-slate-300">
                            <th className="p-2 border border-slate-300">Distribution / Item</th>
                            <th className="p-2 border border-slate-300">Specification</th>
                            <th className="p-2 text-center border border-slate-300 w-16">Qty</th>
                            <th className="p-2 text-right border border-slate-300 w-24">Load (W)</th>
                            <th className="p-2 text-right border border-slate-300 w-24">Current (A)</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-300">
                          
                          {/* Section 1 Header */}
                          <tr className="bg-slate-50 font-bold text-slate-800 border-t-2 border-slate-400">
                            <td colSpan="5" className="p-2 border border-slate-300">
                               <input type="text" value={printHeaders.section1Title} onChange={(e) => updatePrintHeader('section1Title', e.target.value)} className="print-editable font-bold uppercase w-full bg-transparent" />
                            </td>
                          </tr>

                          {reportLightingGroups.length === 0 ? (
                            <tr><td colSpan="5" className="p-3 text-center text-slate-400 text-xs">No lighting groups are linked to this SDB.</td></tr>
                          ) : (
                            reportLightingGroups.map((group, gIndex) => (
                              <React.Fragment key={`P-L-${gIndex}`}>
                                <tr className="bg-slate-50/50 font-semibold text-slate-700">
                                  <td className="p-2 border border-slate-300" colSpan="5">{group.displayName}</td>
                                </tr>
                                {group.boards.map((b, bIndex) => (
                                  <React.Fragment key={`B-${bIndex}`}>
                                    <tr className="text-slate-700 font-medium">
                                      <td className="p-1 pl-4 border border-slate-300 text-xs">- {b.name}</td>
                                      <td className="p-1 border border-slate-300 text-xs text-slate-400">Switchboard Subtotal</td>
                                      <td className="p-1 text-center border border-slate-300 text-xs">{b.points.length}</td>
                                      <td className="p-1 text-right border border-slate-300 text-xs">{b.totalWatt} W</td>
                                      <td className="p-1 text-right border border-slate-300 text-xs">{b.current} A</td>
                                    </tr>
                                    {b.points.map((p, pIndex) => (
                                      <tr key={`pt-${pIndex}`} className="text-slate-500 text-[10px]">
                                        <td className="p-1 pl-8 border border-slate-200 border-r-0"></td>
                                        <td className="p-1 border border-slate-200">
                                           <input type="text" value={p.name} onChange={(e) => updateLightingPoint(group.id, b.id, p.id, 'name', e.target.value)} className="w-24 print-editable bg-transparent inline-block" /> 
                                           (<input type="number" min="0" value={p.watt === 0 ? '' : p.watt} onChange={(e) => updateLightingPoint(group.id, b.id, p.id, 'watt', e.target.value)} className="w-10 text-center print-editable bg-transparent inline-block" />W)
                                        </td>
                                        <td className="p-1 text-center border border-slate-200">
                                           <input type="number" min="1" value={p.qty || ''} onChange={(e) => updateLightingPoint(group.id, b.id, p.id, 'qty', e.target.value)} className="w-10 text-center print-editable bg-transparent inline-block" />
                                        </td>
                                        <td className="p-1 text-right border border-slate-200">{p.qty * p.watt}</td>
                                        <td className="p-1 text-right border border-slate-200">{calculateCurrent(p.qty * p.watt)}</td>
                                      </tr>
                                    ))}
                                  </React.Fragment>
                                ))}
                              </React.Fragment>
                            ))
                          )}

                          {/* Section 2 Header */}
                          <tr className="bg-slate-50 font-bold text-slate-800 border-t-2 border-slate-400">
                            <td colSpan="5" className="p-2 border border-slate-300">
                               <input type="text" value={printHeaders.section2Title} onChange={(e) => updatePrintHeader('section2Title', e.target.value)} className="print-editable font-bold uppercase w-full bg-transparent" />
                            </td>
                          </tr>

                          {reportPowerLoads.length === 0 ? (
                            <tr><td colSpan="5" className="p-3 text-center text-slate-400 text-xs">No records.</td></tr>
                          ) : (
                            reportPowerLoads.map((pl, pIndex) => (
                              <tr key={`P-summary-${pIndex}`} className="text-xs text-slate-700">
                                <td className="p-2 border border-slate-300">
                                  {pl.type === 'GROUP' ? pl.displayName : (
                                    <input type="text" value={pl.name} onChange={(e) => updatePowerLoad(pl.id, 'name', e.target.value)} className="w-24 print-editable bg-transparent inline-block" placeholder="Load Name" />
                                  )} 
                                  {' '}(DF: <input type="number" step="0.05" min="0" max="1" value={pl.diversity} onChange={(e) => updatePowerLoad(pl.id, 'diversity', e.target.value)} className="w-14 text-center print-editable bg-transparent inline-block font-bold text-amber-600" />)
                                </td>
                                <td className="p-2 border border-slate-300 font-medium">
                                  Connected Load: 
                                  {pl.type === 'GROUP' ? (
                                     ` ${(pl.displayWatt * pl.qty).toFixed(1)} W`
                                  ) : (
                                     <React.Fragment>
                                       <input type="number" min="0" value={pl.watt === 0 ? '' : pl.watt} onChange={(e) => updatePowerLoad(pl.id, 'watt', e.target.value)} className="w-12 text-right print-editable bg-transparent inline-block ml-1" /> W
                                     </React.Fragment>
                                  )}
                                </td>
                                <td className="p-2 text-center border border-slate-300">
                                  <input type="number" min="1" value={pl.qty || ''} disabled={pl.type === 'GROUP'} onChange={(e) => updatePowerLoad(pl.id, 'qty', e.target.value)} className="w-10 text-center print-editable bg-transparent inline-block" />
                                </td>
                                <td className="p-2 text-right border border-slate-300">{pl.finalWatt.toFixed(1)} W</td>
                                <td className="p-2 text-right border border-slate-300">{calculateCurrent(pl.finalWatt)} A</td>
                              </tr>
                            ))
                          )}

                          {/* Final Row */}
                          <tr className="bg-slate-100 font-extrabold text-sm border-t-4 border-slate-800">
                            <td colSpan="3" className="p-3 text-right uppercase text-slate-800">Total Calculated Load for {reportSdbName}:</td>
                            <td className="p-3 text-right border border-slate-300 text-slate-900">{reportTotalWatt.toFixed(1)} W</td>
                            <td className="p-3 text-right border border-slate-300 text-slate-900">{reportTotalCurrent} A</td>
                          </tr>

                        </tbody>
                      </table>

                      {/* Sign-off Box */}
                      <div className="mt-8 grid grid-cols-2 gap-16 text-center text-xs text-slate-700">
                        <div className="border-t border-slate-400 pt-2">
                          <input type="text" value={printHeaders.preparedBy} onChange={(e) => updatePrintHeader('preparedBy', e.target.value)} className="print-editable font-bold uppercase text-slate-800 w-full text-center" />
                        </div>
                        <div className="border-t border-slate-400 pt-2">
                          <input type="text" value={printHeaders.approvedBy} onChange={(e) => updatePrintHeader('approvedBy', e.target.value)} className="print-editable font-bold uppercase text-slate-800 w-full text-center" />
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {/* --- TAB: HISTORY --- */}
                {activeTab === 'HISTORY' && (
                  <div className="space-y-6 max-w-4xl mx-auto no-print">
                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                      <div className="p-6 border-b border-slate-200 flex justify-between items-center bg-slate-50">
                        <h2 className="text-xl font-bold text-slate-800 flex items-center gap-2"><HistoryIcon className="w-6 h-6 text-blue-600"/> Saved Reports</h2>
                        <span className="text-xs font-bold text-slate-500 uppercase bg-slate-200 px-3 py-1 rounded-full">{savedReports.length} Reports</span>
                      </div>
                      
                      <div className="p-0">
                        {savedReports.length === 0 ? (
                            <div className="text-center py-20">
                                <div className="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-4">
                                    <HistoryIcon className="w-8 h-8 text-slate-300" />
                                </div>
                                <p className="text-slate-500 font-medium">No saved reports found in cloud storage.</p>
                                <p className="text-slate-400 text-sm mt-1">Go to the Report tab and click "Save to Cloud" to store your work.</p>
                            </div>
                        ) : (
                            <div className="divide-y divide-slate-100">
                                {savedReports.map(report => (
                                    <div key={report.id} className="p-4 sm:p-6 hover:bg-slate-50 transition flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                                        <div>
                                            <h3 className="font-bold text-slate-800 text-lg">{report.name}</h3>
                                            <div className="text-sm text-slate-500 flex items-center gap-2 mt-1">
                                                <span className="bg-slate-100 px-2 py-0.5 rounded text-xs font-medium">{report.dateString}</span>
                                            </div>
                                        </div>
                                        <div className="flex items-center gap-3 w-full sm:w-auto">
                                            <button onClick={() => loadReport(report)} className="flex-1 sm:flex-none px-4 py-2 bg-blue-50 text-blue-700 hover:bg-blue-100 rounded-lg text-sm font-bold transition border border-blue-200">
                                                Load Data
                                            </button>
                                            <button onClick={() => deleteReport(report.id)} className="p-2 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition border border-transparent hover:border-red-200" title="Delete Report">
                                                <Trash2 className="w-5 h-5" />
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                      </div>
                    </div>
                  </div>
                )}
              </main>

              {/* Status Bar */}
              <div className="fixed bottom-0 left-0 w-full bg-slate-100 text-slate-600 border-t border-slate-200 z-30 no-print text-xs">
                <div className="max-w-6xl mx-auto px-4 py-2 flex justify-between items-center">
                  <span className="font-semibold tracking-wider uppercase text-[10px]">System Status: Online {user ? '(Cloud Synced)' : ''}</span>
                  <div className="flex items-center gap-4">
                    <span className="hidden sm:inline">Facility Total Power:</span>
                    <span><strong className="text-slate-800">{globalTotalPower.toFixed(1)} W</strong></span>
                    <span className="text-slate-300">|</span>
                    <span>Total Current: <strong className="text-slate-800">{globalTotalCurrent} A</strong></span>
                  </div>
                </div>
              </div>

              {/* Save Modal */}
              {saveModalOpen && (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-sm px-4">
                  <div className="bg-white rounded-xl shadow-xl w-full max-w-md overflow-hidden animate-in fade-in zoom-in duration-200">
                    <div className="flex justify-between items-center p-4 border-b border-slate-100 bg-slate-50">
                      <h3 className="font-bold text-slate-800">Save Report to Cloud</h3>
                      <button onClick={() => setSaveModalOpen(false)} className="text-slate-400 hover:text-slate-700 transition">
                        <XIcon className="w-5 h-5" />
                      </button>
                    </div>
                    <div className="p-6">
                      <label className="block text-sm font-medium text-slate-700 mb-2">Report Name</label>
                      <input 
                        type="text" 
                        value={newReportName} 
                        onChange={(e) => setNewReportName(e.target.value)} 
                        className="w-full border border-slate-300 rounded-lg px-4 py-2 focus:outline-none focus:border-blue-500" 
                        placeholder="e.g., Final Design - Version 1" 
                        autoFocus
                        onKeyDown={(e) => e.key === 'Enter' && handleSaveReport()}
                      />
                      <p className="text-xs text-slate-500 mt-2">Date and time will be automatically recorded.</p>
                    </div>
                    <div className="p-4 border-t border-slate-100 bg-slate-50 flex justify-end gap-3">
                      <button onClick={() => setSaveModalOpen(false)} className="px-4 py-2 text-slate-600 hover:bg-slate-200 rounded-lg text-sm font-medium transition">Cancel</button>
                      <button onClick={handleSaveReport} disabled={isSaving || !newReportName.trim()} className="px-6 py-2 bg-blue-600 hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed text-white rounded-lg text-sm font-bold shadow-sm transition flex items-center gap-2">
                        {isSaving ? 'Saving...' : 'Save Now'}
                      </button>
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
