<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Load Estimator</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for compiling JSX in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;

        // --- SVG Icons (Converted from Lucide-react) ---
        const Plus = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>;
        const Trash2 = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>;
        const Zap = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>;
        const Settings2 = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>;
        const Activity = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>;
        const ListOrdered = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="10" y1="6" x2="21" y2="6"></line><line x1="10" y1="12" x2="21" y2="12"></line><line x1="10" y1="18" x2="21" y2="18"></line><path d="M4 6h1v4"></path><path d="M4 10h2"></path><path d="M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"></path></svg>;
        const TableIcon = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3v18"></path><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M3 9h18"></path><path d="M3 15h18"></path></svg>;
        const Edit3 = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>;
        const Folder = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"></path></svg>;
        const ShieldAlert = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg>;

        function App() {
          const [activeTab, setActiveTab] = useState('LIGHTING'); // LIGHTING | POWER | SUMMARY
          const [settings, setSettings] = useState({ voltage: 230, powerFactor: 0.85 });
          const defaultGroups = ['Group-1', 'Group-2', 'Main DB', 'Sub DB-1'];
          
          // --- Lighting Load State (Switchboards) ---
          const [boards, setBoards] = useState([
            {
              id: 'sb-1',
              name: 'Switch Board 1',
              group: 'Group-1',
              points: [
                { id: 'p-1', name: 'CF (Ceiling Fan)', qty: 1, watt: 80 },
                { id: 'p-2', name: 'TL (Tube Light)', qty: 1, watt: 40 }
              ]
            }
          ]);

          // --- Power Load State (SDB) ---
          const [powerLoads, setPowerLoads] = useState([
            { id: 'pl-1', name: 'Air Conditioner', qty: 1, watt: 1200, diversity: 0.8 }
          ]);

          // Constants for quick add buttons
          const lightingDefaults = [
            { label: 'CF', full: 'CF (Ceiling Fan)', w: 80 },
            { label: 'TL', full: 'TL (Tube Light)', w: 40 },
            { label: 'CL', full: 'CL (Ceiling Light)', w: 20 },
            { label: 'WL', full: 'WL (Wall Light)', w: 20 },
            { label: 'ExF', full: 'ExF (Exhaust Fan)', w: 40 },
            { label: 'ChL', full: 'ChL (Chandelier)', w: 40 },
            { label: 'ML', full: 'ML (Mirror Light)', w: 10 },
            { label: '2-Pin', full: '2-Pin Socket', w: 200 }
          ];

          const powerDefaults = [
            { label: '3-Pin', full: '3-Pin Socket', w: 1000 },
            { label: 'AC', full: 'Air Conditioner', w: 1200 },
            { label: 'Geyser', full: 'Water Geyser', w: 1200 },
            { label: 'Motor', full: 'Water Pump/Motor', w: 1000 }
          ];

          const calculateCurrent = (wattage) => {
            if (!settings.voltage || !settings.powerFactor || wattage === 0) return 0;
            return (wattage / (settings.voltage * settings.powerFactor)).toFixed(2);
          };

          // --- Lighting Logic ---
          const getBoardTotalWatt = (board) => board.points.reduce((sum, p) => sum + (p.qty * p.watt), 0);

          const updateSetting = (field, value) => setSettings({ ...settings, [field]: parseFloat(value) || 0 });

          const addBoard = () => {
            setBoards([...boards, { id: `sb-${Date.now()}`, name: `Switchboard ${boards.length + 1}`, group: 'Group-1', points: [] }]);
          };

          const updateBoardField = (boardId, field, value) => setBoards(boards.map(b => b.id === boardId ? { ...b, [field]: value } : b));
          const deleteBoard = (boardId) => setBoards(boards.filter(b => b.id !== boardId));

          const addLightingPoint = (boardId, defaultName = 'New Point', defaultWatt = 0) => {
            setBoards(boards.map(b => {
              if (b.id === boardId) {
                return { ...b, points: [...b.points, { id: `p-${Date.now()}`, name: defaultName, qty: 1, watt: defaultWatt }] };
              }
              return b;
            }));
          };

          const updateLightingPoint = (boardId, pointId, field, value) => {
            setBoards(boards.map(b => {
              if (b.id === boardId) {
                return {
                  ...b,
                  points: b.points.map(p => {
                    if (p.id === pointId) {
                      return { ...p, [field]: field === 'name' ? value : (parseFloat(value) || 0) };
                    }
                    return p;
                  })
                };
              }
              return b;
            }));
          };

          const deleteLightingPoint = (boardId, pointId) => {
            setBoards(boards.map(b => {
              if (b.id === boardId) {
                return { ...b, points: b.points.filter(p => p.id !== pointId) };
              }
              return b;
            }));
          };

          // --- Power Load Logic ---
          const getPowerLoadTotal = (pl) => pl.qty * pl.watt * pl.diversity;

          const addPowerLoad = (defaultName = 'New Power Load', defaultWatt = 0) => {
            setPowerLoads([...powerLoads, { id: `pl-${Date.now()}`, name: defaultName, qty: 1, watt: defaultWatt, diversity: 1.0 }]);
          };

          const updatePowerLoad = (plId, field, value) => {
            setPowerLoads(powerLoads.map(pl => {
              if (pl.id === plId) {
                return { ...pl, [field]: field === 'name' ? value : (parseFloat(value) || 0) };
              }
              return pl;
            }));
          };

          const deletePowerLoad = (plId) => setPowerLoads(powerLoads.filter(pl => pl.id !== plId));

          // --- Global Computations ---
          const { grandTotals, groupedLightingData, totalPowerWatt } = useMemo(() => {
            let lightingWatt = 0;
            const groupsMap = {};

            // Lighting Calculations
            boards.forEach(b => {
              const bTotalWatt = getBoardTotalWatt(b);
              lightingWatt += bTotalWatt;

              const groupName = b.group || 'Uncategorized';
              if (!groupsMap[groupName]) {
                groupsMap[groupName] = { name: groupName, boards: [], totalWatt: 0 };
              }
              
              groupsMap[groupName].boards.push({
                ...b,
                totalWatt: bTotalWatt,
                current: calculateCurrent(bTotalWatt)
              });
              groupsMap[groupName].totalWatt += bTotalWatt;
            });

            const groupedArray = Object.values(groupsMap).sort((a, b) => a.name.localeCompare(b.name));

            // Power Calculations
            const powerWatt = powerLoads.reduce((sum, pl) => sum + getPowerLoadTotal(pl), 0);
            
            const totalOverallWatt = lightingWatt + powerWatt;

            return {
              grandTotals: { 
                totalBoards: boards.length, 
                lightingWatt: lightingWatt,
                powerWatt: powerWatt,
                totalWatt: totalOverallWatt, 
                totalCurrent: calculateCurrent(totalOverallWatt) 
              },
              groupedLightingData: groupedArray,
              totalPowerWatt: powerWatt
            };
          }, [boards, powerLoads, settings]);

          return (
            <div className="min-h-screen font-sans text-slate-800 pb-24 bg-slate-100">
              <header className="bg-indigo-900 text-white shadow-md sticky top-0 z-20">
                <div className="max-w-6xl mx-auto px-4 py-4 sm:px-6 lg:px-8">
                  <div className="flex flex-col md:flex-row justify-between items-center gap-4">
                    <div className="flex items-center gap-3">
                      <Zap className="w-8 h-8 text-amber-400" />
                      <div>
                        <h1 className="text-xl font-bold tracking-wide">Pro Load Estimator</h1>
                        <p className="text-xs text-indigo-300">Lighting & Power SDB Analysis</p>
                      </div>
                    </div>

                    <div className="flex bg-indigo-950 rounded-lg p-1 border border-indigo-800 overflow-x-auto w-full md:w-auto">
                      <button 
                        onClick={() => setActiveTab('LIGHTING')}
                        className={`flex items-center whitespace-nowrap gap-2 px-3 py-2 rounded-md text-sm font-medium transition-colors ${activeTab === 'LIGHTING' ? 'bg-indigo-600 text-white shadow' : 'text-indigo-300 hover:text-white'}`}
                      >
                        <Edit3 className="w-4 h-4" /> Lighting (SB)
                      </button>
                      <button 
                        onClick={() => setActiveTab('POWER')}
                        className={`flex items-center whitespace-nowrap gap-2 px-3 py-2 rounded-md text-sm font-medium transition-colors ${activeTab === 'POWER' ? 'bg-indigo-600 text-white shadow' : 'text-indigo-300 hover:text-white'}`}
                      >
                        <ShieldAlert className="w-4 h-4" /> Power (SDB)
                      </button>
                      <button 
                        onClick={() => setActiveTab('SUMMARY')}
                        className={`flex items-center whitespace-nowrap gap-2 px-3 py-2 rounded-md text-sm font-medium transition-colors ${activeTab === 'SUMMARY' ? 'bg-indigo-600 text-white shadow' : 'text-indigo-300 hover:text-white'}`}
                      >
                        <TableIcon className="w-4 h-4" /> Summary
                      </button>
                    </div>
                    
                    <div className="flex items-center gap-4 bg-indigo-800 p-2 rounded-lg border border-indigo-700 shadow-inner">
                      <div className="flex items-center gap-2">
                        <label className="text-xs font-medium text-indigo-200 uppercase tracking-wider">Volts</label>
                        <input 
                          type="number" 
                          value={settings.voltage} 
                          onChange={(e) => updateSetting('voltage', e.target.value)}
                          className="w-16 px-2 py-1 bg-white text-indigo-900 rounded focus:outline-none focus:ring-2 focus:ring-amber-400 text-sm font-semibold text-center"
                        />
                      </div>
                      <div className="w-px h-6 bg-indigo-600"></div>
                      <div className="flex items-center gap-2">
                        <label className="text-xs font-medium text-indigo-200 uppercase tracking-wider">PF</label>
                        <input 
                          type="number" 
                          step="0.01"
                          value={settings.powerFactor} 
                          onChange={(e) => updateSetting('powerFactor', e.target.value)}
                          className="w-16 px-2 py-1 bg-white text-indigo-900 rounded focus:outline-none focus:ring-2 focus:ring-amber-400 text-sm font-semibold text-center"
                        />
                      </div>
                    </div>
                  </div>
                </div>
              </header>

              <main className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                
                {/* --- TAB 1: LIGHTING ENTRY (SB) --- */}
                {activeTab === 'LIGHTING' && (
                  <div className="space-y-6">
                    {boards.length === 0 && (
                      <div className="text-center py-16 bg-white rounded-xl border-2 border-dashed border-slate-300">
                        <Settings2 className="w-12 h-12 text-slate-300 mx-auto mb-3" />
                        <p className="text-slate-500 font-medium">No switchboards added yet.</p>
                        <button onClick={addBoard} className="mt-4 px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition shadow">
                          + Add Your First Switchboard
                        </button>
                      </div>
                    )}

                    {boards.map((board, index) => {
                      const boardTotalWatt = getBoardTotalWatt(board);
                      const boardCurrent = calculateCurrent(boardTotalWatt);

                      return (
                        <div key={board.id} className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                          <div className="bg-slate-100 px-4 py-3 border-b border-slate-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                            <div className="flex flex-col sm:flex-row items-start sm:items-center gap-3 w-full md:w-auto">
                              <div className="bg-indigo-600 text-white w-7 h-7 rounded-full flex items-center justify-center text-sm font-bold shadow-sm shrink-0">
                                {index + 1}
                              </div>
                              <input
                                type="text"
                                value={board.name}
                                onChange={(e) => updateBoardField(board.id, 'name', e.target.value)}
                                placeholder="e.g. Switchboard 1"
                                className="bg-white border border-slate-300 px-3 py-1.5 rounded-md font-semibold text-slate-700 focus:outline-none focus:border-indigo-500 w-full sm:w-64"
                              />
                              <div className="relative w-full sm:w-48 flex items-center">
                                <Folder className="w-4 h-4 text-slate-400 absolute left-3" />
                                <input
                                  type="text"
                                  list={`groups-${board.id}`}
                                  value={board.group}
                                  onChange={(e) => updateBoardField(board.id, 'group', e.target.value)}
                                  placeholder="Assign to Group..."
                                  className="bg-white border border-slate-300 pl-8 pr-3 py-1.5 rounded-md text-sm text-slate-700 focus:outline-none focus:border-indigo-500 w-full"
                                />
                                <datalist id={`groups-${board.id}`}>
                                  {defaultGroups.map(g => <option key={g} value={g} />)}
                                </datalist>
                              </div>
                            </div>
                            <button onClick={() => deleteBoard(board.id)} className="text-red-500 hover:text-red-700 hover:bg-red-50 p-2 rounded flex items-center gap-1 text-sm font-medium shrink-0 self-end md:self-auto">
                              <Trash2 className="w-4 h-4" /> <span className="hidden sm:inline">Delete SB</span>
                            </button>
                          </div>

                          <div className="p-4 sm:p-6">
                            {board.points.length === 0 ? (
                              <p className="text-sm text-slate-400 italic mb-4 text-center">No points added to this board yet.</p>
                            ) : (
                              <div className="space-y-3 mb-6">
                                <div className="hidden sm:grid grid-cols-12 gap-4 text-xs font-semibold text-slate-500 uppercase tracking-wider px-2">
                                  <div className="col-span-5">Point Name / Item</div>
                                  <div className="col-span-2 text-center">Quantity</div>
                                  <div className="col-span-2 text-center">Watt/Unit</div>
                                  <div className="col-span-2 text-right">Total Watt</div>
                                  <div className="col-span-1 text-center">Act</div>
                                </div>

                                {board.points.map(point => (
                                  <div key={point.id} className="flex flex-col sm:grid sm:grid-cols-12 gap-2 sm:gap-4 items-center bg-slate-50 sm:bg-transparent p-3 sm:p-0 rounded-lg sm:rounded-none border sm:border-none border-slate-200">
                                    <div className="col-span-5 w-full">
                                      <label className="sm:hidden text-[10px] text-slate-400 uppercase font-bold mb-1 block">Item Name</label>
                                      <input
                                        type="text"
                                        value={point.name}
                                        onChange={(e) => updateLightingPoint(board.id, point.id, 'name', e.target.value)}
                                        className="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-indigo-500 bg-white"
                                      />
                                    </div>
                                    <div className="col-span-4 w-full flex gap-2 sm:contents">
                                      <div className="col-span-2 w-1/2 sm:w-full">
                                        <label className="sm:hidden text-[10px] text-slate-400 uppercase font-bold mb-1 block">Qty</label>
                                        <input
                                          type="number"
                                          min="1"
                                          value={point.qty || ''}
                                          onChange={(e) => updateLightingPoint(board.id, point.id, 'qty', e.target.value)}
                                          className="w-full border border-slate-300 rounded px-3 py-2 text-sm text-center focus:outline-none focus:border-indigo-500 bg-white"
                                        />
                                      </div>
                                      <div className="col-span-2 w-1/2 sm:w-full relative">
                                        <label className="sm:hidden text-[10px] text-slate-400 uppercase font-bold mb-1 block">Watt/Unit</label>
                                        <input
                                          type="number"
                                          min="0"
                                          value={point.watt === 0 && point.watt !== '0' ? '' : point.watt}
                                          onChange={(e) => updateLightingPoint(board.id, point.id, 'watt', e.target.value)}
                                          className="w-full border border-slate-300 rounded px-3 py-2 text-sm text-center focus:outline-none focus:border-indigo-500 bg-white"
                                        />
                                      </div>
                                    </div>
                                    <div className="col-span-3 w-full flex items-center justify-between sm:contents mt-2 sm:mt-0 pt-2 sm:pt-0 border-t sm:border-none border-slate-200">
                                      <div className="col-span-2 text-right font-bold text-indigo-700 w-full pr-4">
                                        <span className="sm:hidden text-xs font-normal text-slate-500 mr-2">Total:</span>
                                        {(point.qty * point.watt) || 0} W
                                      </div>
                                      <div className="col-span-1 text-center">
                                        <button onClick={() => deleteLightingPoint(board.id, point.id)} className="p-2 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-full transition">
                                          <Trash2 className="w-4 h-4" />
                                        </button>
                                      </div>
                                    </div>
                                  </div>
                                ))}
                              </div>
                            )}
                            <div className="flex flex-wrap items-center gap-2 border-t border-slate-100 pt-4">
                              <span className="text-sm font-medium text-slate-500 mr-2">Add Lighting Points:</span>
                              {lightingDefaults.map(item => (
                                <button key={item.label} onClick={() => addLightingPoint(board.id, item.full, item.w)} className="px-2 py-1 bg-slate-100 hover:bg-indigo-50 hover:text-indigo-700 rounded text-xs font-medium text-slate-600 transition border border-slate-200 hover:border-indigo-200">
                                  {item.label}
                                </button>
                              ))}
                              <span className="text-slate-300 mx-1">|</span>
                              <button onClick={() => addLightingPoint(board.id, '', 0)} className="flex items-center gap-1 px-2 py-1 bg-indigo-50 text-indigo-700 border border-indigo-200 rounded text-xs font-bold hover:bg-indigo-100 transition"><Plus className="w-3 h-3" /> Custom</button>
                            </div>
                          </div>
                          <div className="bg-indigo-50 px-6 py-3 border-t border-indigo-100 flex justify-end gap-6">
                            <div className="flex items-center gap-2">
                              <span className="text-[10px] text-indigo-600 uppercase font-bold tracking-wider">SB Total Power:</span>
                              <span className="text-md font-bold text-indigo-900">{boardTotalWatt} <span className="text-xs font-medium">W</span></span>
                            </div>
                            <div className="w-px h-6 bg-indigo-200"></div>
                            <div className="flex items-center gap-2">
                              <span className="text-[10px] text-blue-600 uppercase font-bold tracking-wider">Est. Current:</span>
                              <span className="text-md font-bold text-blue-700">{boardCurrent} <span className="text-xs font-medium">A</span></span>
                            </div>
                          </div>
                        </div>
                      );
                    })}
                    {boards.length > 0 && (
                      <button onClick={addBoard} className="w-full py-4 border-2 border-dashed border-indigo-300 text-indigo-700 font-semibold rounded-xl hover:bg-indigo-50 transition flex items-center justify-center gap-2">
                        <Plus className="w-5 h-5" /> Add Another Switchboard
                      </button>
                    )}
                  </div>
                )}

                {/* --- TAB 2: POWER ENTRY (SDB) --- */}
                {activeTab === 'POWER' && (
                  <div className="space-y-6">
                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                      <div className="bg-emerald-800 text-white p-5 flex justify-between items-center">
                        <div>
                          <h2 className="text-xl font-bold flex items-center gap-2"><ShieldAlert className="w-5 h-5 text-emerald-300"/> SDB Power Loads</h2>
                          <p className="text-sm text-emerald-100">Calculate heavy loads with Diversity Factor</p>
                        </div>
                      </div>

                      <div className="p-4 sm:p-6">
                        {powerLoads.length === 0 ? (
                          <div className="text-center py-10 bg-slate-50 rounded-lg border-2 border-dashed border-slate-300">
                            <p className="text-slate-500 font-medium">No power loads added to SDB yet.</p>
                          </div>
                        ) : (
                          <div className="space-y-3 mb-6">
                            <div className="hidden sm:grid grid-cols-12 gap-4 text-xs font-semibold text-slate-500 uppercase tracking-wider px-2">
                              <div className="col-span-4">Power Load Item</div>
                              <div className="col-span-2 text-center">Quantity</div>
                              <div className="col-span-2 text-center">Watt/Unit</div>
                              <div className="col-span-2 text-center text-emerald-600">Diversity (DF)</div>
                              <div className="col-span-1 text-right">Final W</div>
                              <div className="col-span-1 text-center">Act</div>
                            </div>

                            {powerLoads.map(pl => {
                              const finalWatt = getPowerLoadTotal(pl);
                              return (
                                <div key={pl.id} className="flex flex-col sm:grid sm:grid-cols-12 gap-2 sm:gap-4 items-center bg-emerald-50/50 sm:bg-transparent p-3 sm:p-0 rounded-lg sm:rounded-none border sm:border-none border-emerald-100">
                                  <div className="col-span-4 w-full">
                                    <label className="sm:hidden text-[10px] text-slate-400 uppercase font-bold mb-1 block">Item Name</label>
                                    <input
                                      type="text"
                                      value={pl.name}
                                      onChange={(e) => updatePowerLoad(pl.id, 'name', e.target.value)}
                                      className="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-emerald-500 bg-white"
                                    />
                                  </div>
                                  
                                  <div className="col-span-6 w-full flex gap-2 sm:contents">
                                    <div className="col-span-2 w-1/3 sm:w-full">
                                      <label className="sm:hidden text-[10px] text-slate-400 uppercase font-bold mb-1 block">Qty</label>
                                      <input
                                        type="number" min="1" value={pl.qty || ''}
                                        onChange={(e) => updatePowerLoad(pl.id, 'qty', e.target.value)}
                                        className="w-full border border-slate-300 rounded px-2 py-2 text-sm text-center focus:outline-none focus:border-emerald-500 bg-white"
                                      />
                                    </div>
                                    <div className="col-span-2 w-1/3 sm:w-full">
                                      <label className="sm:hidden text-[10px] text-slate-400 uppercase font-bold mb-1 block">Watt/Unit</label>
                                      <input
                                        type="number" min="0" value={pl.watt === 0 && pl.watt !== '0' ? '' : pl.watt}
                                        onChange={(e) => updatePowerLoad(pl.id, 'watt', e.target.value)}
                                        className="w-full border border-slate-300 rounded px-2 py-2 text-sm text-center focus:outline-none focus:border-emerald-500 bg-white"
                                      />
                                    </div>
                                    <div className="col-span-2 w-1/3 sm:w-full">
                                      <label className="sm:hidden text-[10px] text-emerald-600 uppercase font-bold mb-1 block">Div. Factor</label>
                                      <input
                                        type="number" step="0.05" min="0" max="1" value={pl.diversity}
                                        onChange={(e) => updatePowerLoad(pl.id, 'diversity', e.target.value)}
                                        className="w-full border border-emerald-300 bg-emerald-50 text-emerald-900 font-bold rounded px-2 py-2 text-sm text-center focus:outline-none focus:ring-2 focus:ring-emerald-400"
                                        title="Diversity Factor (0 to 1)"
                                      />
                                    </div>
                                  </div>

                                  <div className="col-span-2 w-full flex items-center justify-between sm:contents mt-2 sm:mt-0 pt-2 sm:pt-0 border-t sm:border-none border-emerald-100">
                                    <div className="col-span-1 text-right font-bold text-emerald-700 w-full pr-2">
                                      <span className="sm:hidden text-xs font-normal text-slate-500 mr-2">Final:</span>
                                      {finalWatt.toFixed(1)} W
                                    </div>
                                    <div className="col-span-1 text-center">
                                      <button onClick={() => deletePowerLoad(pl.id)} className="p-2 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-full transition">
                                        <Trash2 className="w-4 h-4" />
                                      </button>
                                    </div>
                                  </div>
                                </div>
                              );
                            })}
                          </div>
                        )}
                        
                        <div className="flex flex-wrap items-center gap-2 border-t border-slate-100 pt-4">
                          <span className="text-sm font-medium text-slate-500 mr-2">Quick Add Power Load:</span>
                          {powerDefaults.map(item => (
                            <button key={item.label} onClick={() => addPowerLoad(item.full, item.w)} className="px-3 py-1.5 bg-emerald-50 hover:bg-emerald-100 hover:text-emerald-800 rounded text-sm font-medium text-emerald-700 transition border border-emerald-200">
                              + {item.label}
                            </button>
                          ))}
                          <span className="text-slate-300 mx-1">|</span>
                          <button onClick={() => addPowerLoad('', 0)} className="flex items-center gap-1 px-3 py-1.5 bg-slate-100 text-slate-700 border border-slate-300 rounded text-sm font-bold hover:bg-slate-200 transition"><Plus className="w-3 h-3" /> Custom Load</button>
                        </div>
                      </div>

                      <div className="bg-emerald-50 px-6 py-4 border-t border-emerald-200 flex justify-end gap-6 shadow-inner">
                        <div className="flex items-center gap-2">
                          <span className="text-xs text-emerald-600 uppercase font-bold tracking-wider">Subtotal Power (w/ Div):</span>
                          <span className="text-xl font-bold text-emerald-900">{grandTotals.powerWatt.toFixed(1)} <span className="text-sm font-medium">W</span></span>
                        </div>
                        <div className="w-px h-8 bg-emerald-300"></div>
                        <div className="flex items-center gap-2">
                          <span className="text-xs text-blue-600 uppercase font-bold tracking-wider">Est. Current:</span>
                          <span className="text-xl font-bold text-blue-700">{calculateCurrent(grandTotals.powerWatt)} <span className="text-sm font-medium">A</span></span>
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {/* --- TAB 3: SUMMARY --- */}
                {activeTab === 'SUMMARY' && (
                  <div className="space-y-6">
                    <div className="bg-white rounded-xl shadow-md border border-slate-200 overflow-hidden">
                      <div className="bg-slate-800 text-white p-5 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                        <div>
                          <h2 className="text-xl font-bold flex items-center gap-2"><TableIcon className="w-5 h-5 text-indigo-300"/> Project Final Load Summary</h2>
                          <p className="text-sm text-slate-300">Lighting (SB) & Power (SDB) Analysis</p>
                        </div>
                        <div className="bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-600 text-sm flex gap-3">
                           <span><span className="text-slate-400">V:</span> {settings.voltage}</span>
                           <span><span className="text-slate-400">PF:</span> {settings.powerFactor}</span>
                        </div>
                      </div>

                      <div className="p-0 overflow-x-auto">
                        <table className="w-full text-left border-collapse">
                          <thead>
                            <tr className="bg-slate-100 text-slate-600 text-sm border-b border-slate-200 uppercase tracking-wider">
                              <th className="p-4 font-semibold">Category / Location</th>
                              <th className="p-4 font-semibold">Item / Board Name</th>
                              <th className="p-4 font-semibold text-right">Points/Qty</th>
                              <th className="p-4 font-semibold text-right">Final Load (W)</th>
                              <th className="p-4 font-semibold text-right">Est. Current (A)</th>
                            </tr>
                          </thead>
                          <tbody className="text-slate-700 divide-y divide-slate-100">
                            
                            {/* --- Lighting Summary Section --- */}
                            <tr className="bg-indigo-100/50">
                              <td colSpan="5" className="p-3 font-bold text-indigo-800 border-b-2 border-indigo-200 uppercase text-sm">
                                1. Lighting Loads (Grouped by SB)
                              </td>
                            </tr>
                            
                            {groupedLightingData.length === 0 ? (
                              <tr><td colSpan="5" className="p-4 text-center text-slate-400 italic">No lighting boards added.</td></tr>
                            ) : (
                              groupedLightingData.map((group, gIndex) => (
                                <React.Fragment key={`L-${gIndex}`}>
                                  <tr className="bg-indigo-50/30">
                                    <td colSpan="5" className="p-2 px-4 font-semibold text-indigo-600">
                                      <div className="flex items-center gap-2"><Folder className="w-4 h-4" /> {group.name}</div>
                                    </td>
                                  </tr>
                                  {group.boards.map((b, bIndex) => (
                                    <tr key={bIndex} className="hover:bg-slate-50 transition-colors">
                                      <td className="p-3 pl-10 text-slate-400 text-sm">↳</td>
                                      <td className="p-3 font-medium text-sm">{b.name}</td>
                                      <td className="p-3 text-right text-slate-500 text-sm">{b.points.length}</td>
                                      <td className="p-3 text-right text-sm">{b.totalWatt}</td>
                                      <td className="p-3 text-right text-sm">{b.current}</td>
                                    </tr>
                                  ))}
                                </React.Fragment>
                              ))
                            )}
                            <tr className="bg-indigo-50 font-semibold border-b-4 border-white">
                              <td colSpan="3" className="p-3 pr-4 text-right text-indigo-700 text-sm uppercase tracking-wider">Total Lighting Load</td>
                              <td className="p-3 text-right text-indigo-800">{grandTotals.lightingWatt} W</td>
                              <td className="p-3 text-right text-indigo-800">{calculateCurrent(grandTotals.lightingWatt)} A</td>
                            </tr>

                            {/* --- Power Summary Section --- */}
                            <tr className="bg-emerald-100/50">
                              <td colSpan="5" className="p-3 font-bold text-emerald-800 border-b-2 border-emerald-200 uppercase text-sm mt-4">
                                2. Power Loads (SDB directly)
                              </td>
                            </tr>

                            {powerLoads.length === 0 ? (
                              <tr><td colSpan="5" className="p-4 text-center text-slate-400 italic">No power loads added.</td></tr>
                            ) : (
                              powerLoads.map((pl, pIndex) => (
                                <tr key={`P-${pIndex}`} className="hover:bg-slate-50 transition-colors">
                                  <td className="p-3 pl-10 text-slate-400 text-sm">↳ SDB</td>
                                  <td className="p-3 font-medium text-sm">{pl.name} <span className="text-[10px] bg-emerald-100 text-emerald-700 px-1.5 py-0.5 rounded ml-2">DF: {pl.diversity}</span></td>
                                  <td className="p-3 text-right text-slate-500 text-sm">{pl.qty}</td>
                                  <td className="p-3 text-right text-sm">{getPowerLoadTotal(pl).toFixed(1)}</td>
                                  <td className="p-3 text-right text-sm">{calculateCurrent(getPowerLoadTotal(pl))}</td>
                                </tr>
                              ))
                            )}
                            <tr className="bg-emerald-50 font-semibold">
                              <td colSpan="3" className="p-3 pr-4 text-right text-emerald-700 text-sm uppercase tracking-wider">Total Power Load (w/ Div)</td>
                              <td className="p-3 text-right text-emerald-800">{grandTotals.powerWatt.toFixed(1)} W</td>
                              <td className="p-3 text-right text-emerald-800">{calculateCurrent(grandTotals.powerWatt)} A</td>
                            </tr>

                          </tbody>
                        </table>
                      </div>
                    </div>
                  </div>
                )}
              </main>

              {/* --- GRAND TOTAL STICKY FOOTER --- */}
              <div className="fixed bottom-0 left-0 w-full bg-slate-900 text-white shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] z-30">
                <div className="max-w-6xl mx-auto px-4 py-3 sm:px-6 lg:px-8 flex flex-col sm:flex-row justify-between items-center gap-4">
                  <div className="flex items-center gap-2">
                    <Activity className="w-5 h-5 text-yellow-400" />
                    <span className="font-semibold text-lg text-yellow-50 tracking-wide">GRAND TOTAL (Lighting + Power)</span>
                  </div>
                  
                  <div className="flex items-center justify-between sm:justify-end gap-6 sm:gap-8 overflow-x-auto w-full sm:w-auto pb-2 sm:pb-0">
                    <div className="flex flex-col items-center sm:items-end min-w-max">
                      <span className="text-[10px] text-slate-400 uppercase tracking-widest font-bold">Total Power</span>
                      <div className="flex items-center gap-1.5">
                        <Zap className="w-5 h-5 text-amber-400" />
                        <span className="text-2xl font-bold text-amber-400">{grandTotals.totalWatt.toFixed(1)} <span className="text-sm font-normal">W</span></span>
                      </div>
                    </div>
                    <div className="w-px h-10 bg-slate-700"></div>
                    <div className="flex flex-col items-center sm:items-end min-w-max">
                      <span className="text-[10px] text-slate-400 uppercase tracking-widest font-bold">Total Current</span>
                      <div className="flex items-center gap-1.5">
                        <Activity className="w-5 h-5 text-blue-400" />
                        <span className="text-2xl font-bold text-blue-400">{grandTotals.totalCurrent} <span className="text-sm font-normal">A</span></span>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          );
        }

        // --- Application Mounting ---
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
